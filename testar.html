<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PvP 2D Discord</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { background: #020617; color: white; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

    #login-screen { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    .card { background: #0f172a; border: 2px solid #6366f1; border-radius: 12px; padding: 24px; text-align: center; max-width: 320px; width: 90%; }
    input { width: 100%; padding: 10px; margin: 12px 0; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 1rem; text-align: center; }
    button { width: 100%; padding: 12px; background: #6366f1; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }

    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { background: #0f172a; border: 2px solid #334155; border-radius: 12px; width: 95vw; max-width: 800px; height: auto; aspect-ratio: 4/3; }

    .controls { position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10; pointer-events: none; }
    .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; pointer-events: auto; }
    .btn { background: rgba(30, 41, 59, 0.85); border: 1px solid #6366f1; border-radius: 10px; color: white; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    .btn:active { background: #4338ca; }
    .btn-attack { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(135deg, #ef4444, #991b1b); border: 2px solid #f87171; font-size: 1.6rem; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <h2 style="color:#facc15; margin-bottom: 6px;">⚔️ Arena PvP 2D</h2>
    <p style="font-size: 0.85rem; color:#94a3b8;">Digita o teu nome do Discord:</p>
    <input type="text" id="username" placeholder="Seu Usuário" value="Player_1">
    <button onclick="enterGame()">Entrar no PvP</button>
  </div>
</div>

<div id="game-container">
  <canvas id="arena" width="800" height="600"></canvas>

  <div class="controls">
    <div class="dpad">
      <div class="btn" style="grid-column:2; grid-row:1" id="btn-up">⬆️</div>
      <div class="btn" style="grid-column:1; grid-row:2" id="btn-left">⬅️</div>
      <div class="btn" style="grid-column:3; grid-row:2" id="btn-right">➡️</div>
      <div class="btn" style="grid-column:2; grid-row:3" id="btn-down">⬇️</div>
    </div>
    <div class="btn btn-attack" id="btn-attack">⚔️</div>
  </div>
</div>

<script>
  const socket = io();
  const cvs = document.getElementById('arena');
  const ctx = cvs.getContext('2d');

  let players = {};

  function enterGame() {
    const name = document.getElementById('username').value.trim();
    if (!name) return;
    document.getElementById('login-screen').style.display = 'none';
    socket.emit('joinGame', { username: name });
  }

  socket.on('updatePlayers', (serverPlayers) => { players = serverPlayers; });
  socket.on('playerMoved', (p) => { if (players[p.id]) { players[p.id].x = p.x; players[p.id].y = p.y; } });

  const keys = {};
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  function handleInput() {
    let dx = 0, dy = 0;
    const speed = 4;
    if (keys['w'] || keys['arrowup']) dy -= speed;
    if (keys['s'] || keys['arrowdown']) dy += speed;
    if (keys['a'] || keys['arrowleft']) dx -= speed;
    if (keys['d'] || keys['arrowright']) dx += speed;
    if (dx !== 0 || dy !== 0) socket.emit('move', { dx, dy });
  }

  function bindTouch(id, dx, dy) {
    const el = document.getElementById(id);
    let timer = null;
    const start = (e) => { e.preventDefault(); timer = setInterval(() => socket.emit('move', { dx, dy }), 30); };
    const stop = () => clearInterval(timer);
    el.addEventListener('touchstart', start); el.addEventListener('touchend', stop);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', stop);
  }

  bindTouch('btn-up', 0, -4); bindTouch('btn-down', 0, 4);
  bindTouch('btn-left', -4, 0); bindTouch('btn-right', 4, 0);

  document.getElementById('btn-attack').onclick = () => socket.emit('attack');
  window.addEventListener('keydown', e => { if (e.code === 'Space') socket.emit('attack'); });

  function draw() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
    for (let x = 0; x < cvs.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvs.height); ctx.stroke(); }
    for (let y = 0; y < cvs.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke(); }

    Object.values(players).forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);

      if (p.hp <= 0) {
        ctx.fillStyle = '#f87171'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('💀 Morto', 0, 0);
        ctx.restore(); return;
      }

      ctx.fillStyle = p.color || '#6366f1';
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
      ctx.fillText(p.username, 0, -28);

      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-25, -22, 50, 6);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(-25, -22, 50 * (p.hp / p.maxHp), 6);

      ctx.font = '11px sans-serif'; ctx.fillStyle = '#facc15';
      ctx.fillText(`Kills: ${p.score}`, 0, 36);

      ctx.restore();
    });

    handleInput();
    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
