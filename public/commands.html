<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternus - Comandos</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
            --snow-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --snow-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .snowflake {
            position: absolute;
            top: -30px;
            color: var(--snow-color);
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.85;
        }

        @keyframes fall {
            0% { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0.85; }
            100% { transform: translateY(105vh) translateX(25px) rotate(360deg); opacity: 0; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        .commands-container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 20px;
            color: #38bdf8;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 10px;
        }

        .command-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .command-name {
            font-weight: bold;
            font-size: 16px;
            color: #38bdf8;
        }

        .command-desc {
            font-size: 14px;
            color: #cbd5e1;
        }

        .back-btn {
            margin-top: 40px;
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            z-index: 10;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }
    </style>
</head>
<body>

    <script>
        function createSnowflakes() {
            const count = 20;
            for (let i = 0; i < count; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.innerHTML = '❄️';
                snow.style.fontSize = (Math.random() * 12 + 14) + 'px';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 6 + 5) + 's';
                snow.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(snow);
            }
        }

        async function fetchCommands() {
            try {
                const res = await fetch('/api/commands');
                const data = await res.json();
                
                const container = document.getElementById('commandsList');
                container.innerHTML = '';

                // Comandos de Prefixo
                if (data.prefix.length > 0) {
                    let title = document.createElement('div');
                    title.className = 'section-title';
                    title.innerText = 'Comandos de Prefixo (o.)';
                    container.appendChild(title);

                    data.prefix.forEach(cmd => {
                        let card = document.createElement('div');
                        card.className = 'command-card';
                        card.innerHTML = `<div class="command-name">o.${cmd.name}</div><div class="command-desc">${cmd.description}</div>`;
                        container.appendChild(card);
                    });
                }

                // Comandos Slash
                if (data.slash.length > 0) {
                    let title = document.createElement('div');
                    title.className = 'section-title';
                    title.innerText = 'Comandos de Barra (/)';
                    container.appendChild(title);

                    data.slash.forEach(cmd => {
                        let card = document.createElement('div');
                        card.className = 'command-card';
                        card.innerHTML = `<div class="command-name">/${cmd.name}</div><div class="command-desc">${cmd.description}</div>`;
                        container.appendChild(card);
                    });
                }

                if (data.prefix.length === 0 && data.slash.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nenhum comando encontrado.</p>';
                }

            } catch (err) {
                console.error("Erro ao carregar comandos:", err);
            }
        }

        window.onload = () => {
            createSnowflakes();
            fetchCommands();
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        };
    </script>

    <div class="header">
        <h1>Central de Comandos</h1>
        <p>Lista dinâmica de todos os comandos disponíveis no Aeternus.</p>
    </div>

    <div class="commands-container" id="commandsList">
        <p style="text-align:center; color:#94a3b8;">Carregando comandos...</p>
    </div>

    <a href="/" class="back-btn">Voltar ao Início</a>

</body>
</html>
