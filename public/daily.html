<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily — Aeternus</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo"><a href="index.html"><span class="logo-accent">AET</span>ERNUS</a></div>
            <a href="index.html" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">← Início</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero" style="margin-bottom: 2rem;">
            <h1>🎁 Recompensas Diárias</h1>
            <p>Resgate os seus prémios diários para acelerar o seu progresso.</p>
        </section>

        <section class="features">
            <div class="feature-card">
                <div class="card-icon">🔥</div>
                <h3>Sequência Atual</h3>
                <div class="card-description">
                    <p>7 Dias Consecutivos</p>
                    <p>Bónus de Ouro: +25%</p>
                </div>
            </div>

            <div class="feature-card">
                <div class="card-icon">💎</div>
                <h3>Prémio de Hoje</h3>
                <div class="card-description">
                    <p>+500 Moedas de Ouro</p>
                    <p>+10 Gemas Divinas</p>
                </div>
                <button onclick="showToast('Recompensa resgatada com sucesso!', 'success')" class="btn btn-card">Coletar Recompensa</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 <strong>Aeternus</strong>. Todos os direitos reservados.</p>
    </footer>
    <script src="dashboard-app.js"></script>
