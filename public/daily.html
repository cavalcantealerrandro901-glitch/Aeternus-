<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily — Aeternus</title>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-family: system-ui, sans-serif;
            background: var(--bg-color, #0f172a); color: var(--text-color, #f8fafc);
            padding: 24px; box-sizing: border-box; text-align: center;
        }
        a.back { color: #38bdf8; text-decoration: none; margin-bottom: 20px; display: inline-block; }
        h1 { margin: 0 0 8px; color: #38bdf8; }
        .sub { color: #94a3b8; margin-bottom: 24px; }
        .daily-btn {
            width: min(420px, 100%); border: none; cursor: pointer; border-radius: 16px; overflow: hidden;
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 1px solid #4c1d95; padding: 0; position: relative;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.35);
        }
        .daily-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .daily-btn img { width: 100%; height: 180px; object-fit: cover; display: block; filter: brightness(0.8); }
        .daily-btn .label {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2));
            color: #fff; font-weight: 800; font-size: 1.2rem; text-shadow: 0 2px 8px #000; padding: 12px;
        }
        .daily-btn .sub2 { font-size: 12px; font-weight: 600; margin-top: 6px; color: #c4b5fd; }
        #dailyOverlay {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: #000; align-items: center; justify-content: center;
        }
        #dailyOverlay.active { display: flex; }
        #dailyOverlay video {
            width: 100%; height: 100%; object-fit: contain; pointer-events: none; background: #000;
        }
        #dailyResult {
            display: none; position: absolute; inset: 0; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); color: #fff; text-align: center; padding: 24px;
        }
        #dailyResult.active { display: flex; }
        #dailyResult h2 { margin: 0 0 8px; color: #fbbf24; }
        #dailyResult .amt { font-size: 2.4rem; font-weight: 900; color: #86efac; margin: 8px 0 20px; }
        #dailyResult button {
            background: #38bdf8; color: #0f172a; border: none; border-radius: 999px;
            padding: 12px 28px; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>
    <a class="back" href="/">← Voltar</a>
    <h1 data-i18n="reward">🎁 Recompensa diária</h1>
    <p class="sub" data-i18n="daily_sub">5.000 — 50.000 almas · 1x por dia</p>

    <button type="button" class="daily-btn" id="dailyBtn" onclick="claimDaily()">
        <img src="/videos/daily-poster.jpg" alt="" onerror="this.remove()">
        <div class="label">
            <span data-i18n="daily_title">Pegue sua recompensa diária</span>
            <span class="sub2">Clique para abrir o baú</span>
        </div>
    </button>

    <div id="dailyOverlay">
        <video id="dailyVideo" src="/videos/daily-reward.mp4" playsinline preload="auto"></video>
        <div id="dailyResult">
            <h2 data-i18n="reward">✨ Recompensa diária</h2>
            <div class="amt" id="dailyAmount">+0</div>
            <p style="opacity:0.85;margin:0 0 16px;">Almas creditadas na sua conta</p>
            <button type="button" onclick="closeDaily()" data-i18n="continue">Continuar</button>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script>
        let claiming = false;

        async function claimDaily() {
            if (claiming) return;
            claiming = true;
            const btn = document.getElementById('dailyBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/daily-claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    credentials: 'include'
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 401) {
                    window.location.href = '/auth/discord';
                    return;
                }
                if (!res.ok) {
                    alert(data.error || 'Não foi possível resgatar agora.');
                    btn.disabled = false;
                    claiming = false;
                    return;
                }
                playDailyVideo(data.amount || 0);
            } catch (e) {
                alert('Erro de conexão.');
                btn.disabled = false;
                claiming = false;
            }
        }

        function playDailyVideo(amount) {
            const overlay = document.getElementById('dailyOverlay');
            const video = document.getElementById('dailyVideo');
            const result = document.getElementById('dailyResult');
            result.classList.remove('active');
            document.getElementById('dailyAmount').textContent =
                '+' + Number(amount).toLocaleString('pt-BR') + ' almas';
            overlay.classList.add('active');
            video.currentTime = 0;
            video.controls = false;
            video.oncontextmenu = (e) => e.preventDefault();
            const p = video.play();
            if (p && p.catch) p.catch(() => result.classList.add('active'));
            video.onended = () => result.classList.add('active');
        }

        function closeDaily() {
            const video = document.getElementById('dailyVideo');
            video.pause();
            video.currentTime = 0;
            document.getElementById('dailyResult').classList.remove('active');
            document.getElementById('dailyOverlay').classList.remove('active');
            claiming = false;
            document.getElementById('dailyBtn').disabled = false;
        }
    </script>
</body>
</html>
