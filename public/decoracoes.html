<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeternus · Decorações</title>
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(18, 24, 38, 0.85);
      --accent: #c4b5fd;
      --accent2: #f0abfc;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --glow: 0 0 40px rgba(167, 139, 250, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: #070a12;
      overflow-x: hidden;
    }
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(900px 500px at 15% -5%, rgba(88, 28, 135, 0.55), transparent 55%),
        radial-gradient(700px 400px at 90% 10%, rgba(219, 39, 119, 0.25), transparent 50%),
        radial-gradient(600px 500px at 50% 100%, rgba(30, 64, 175, 0.2), transparent 55%),
        #070a12;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0% { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(18deg) brightness(1.08); }
    }
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .wrap { position: relative; z-index: 1; }

    .nav-menu {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 40;
    }
    .nav-toggle {
      width: 46px; height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(196, 181, 253, 0.45);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: var(--glow);
      backdrop-filter: blur(10px);
    }
    .nav-panel {
      display: none;
      position: absolute;
      top: 54px;
      right: 0;
      min-width: 210px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(196, 181, 253, 0.35);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .nav-panel.open { display: block; }
    .nav-panel a {
      display: block;
      padding: 12px 16px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
    }
    .nav-panel a:last-child { border-bottom: none; }
    .nav-panel a:hover { background: rgba(124, 58, 237, 0.25); }
    .nav-panel a.active { color: #e9d5ff; }

    header { padding: 56px 20px 10px; text-align: center; }
    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #e9d5ff, #f0abfc, #a5b4fc, #e9d5ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    header p { color: var(--muted); margin: 10px auto 0; max-width: 520px; }
    .bal {
      display: inline-flex; gap: 18px; margin-top: 16px;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(167, 139, 250, 0.35);
      box-shadow: var(--glow);
      backdrop-filter: blur(12px);
    }
    .msg { text-align: center; padding: 14px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 22px;
      padding: 12px 20px 48px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(18px);
      animation: cardIn 0.55s ease forwards;
      transition: transform .25s ease, border-color .25s, box-shadow .25s;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(192, 132, 252, 0.75);
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.35);
    }
    @keyframes cardIn { to { opacity: 1; transform: none; } }
    .card .img-wrap { position: relative; height: 168px; overflow: hidden; }
    .card img {
      width: 100%; height: 100%; object-fit: cover; display: block; background: #0f172a;
      transition: transform .45s ease;
    }
    .card:hover img { transform: scale(1.08); }
    .card .img-wrap::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.18) 50%, transparent 60%);
      transform: translateX(-120%);
    }
    .card:hover .img-wrap::after { animation: sweep 0.9s ease; }
    @keyframes sweep { to { transform: translateX(120%); } }
    .badge {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; backdrop-filter: blur(8px); z-index: 2;
    }
    .badge.owned {
      background: rgba(16, 185, 129, 0.25); color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.45);
    }
    .badge.equipped {
      background: rgba(167, 139, 250, 0.3); color: #e9d5ff;
      border: 1px solid rgba(196, 181, 253, 0.5);
    }
    .card .body { padding: 14px 16px 16px; }
    .card h3 { margin: 0 0 6px; font-size: 1.08rem; }
    .card .desc { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
    .price { color: var(--accent); font-weight: 800; font-size: 1.05rem; }

    .modal-bg {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(440px, 100%);
      background: linear-gradient(160deg, rgba(30, 27, 75, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(167, 139, 250, 0.45);
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 24px 80px rgba(88, 28, 135, 0.55), var(--glow);
    }
    .modal img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .modal .mbody { padding: 18px 20px 22px; }
    .modal h2 { margin: 0 0 6px; }
    .modal p { margin: 0 0 14px; color: var(--muted); }
    .modal .mprice { font-size: 1.4rem; font-weight: 800; color: var(--accent2); margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .modal-actions button {
      flex: 1; min-width: 120px; padding: 12px 14px; border-radius: 12px;
      border: none; font-weight: 700; cursor: pointer;
    }
    .btn-buy { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; }
    .btn-cancel { background: rgba(51, 65, 85, 0.7); color: var(--text); }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 1px solid rgba(196, 181, 253, 0.5);
      color: #fff; padding: 14px 22px; border-radius: 14px;
      opacity: 0; transition: .25s; pointer-events: none; z-index: 60; font-weight: 600;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <canvas id="particles"></canvas>

  <div class="nav-menu">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu">☰</button>
    <div class="nav-panel" id="navPanel">
      <a href="/decoracoes" class="active" id="linkDecor">🎨 Decorações</a>
      <a href="/itens" id="linkItens">🎁 Itens</a>
      <a href="/dashboard">⚙️ Painel</a>
      <a href="/login">🔐 Login</a>
    </div>
  </div>

  <div class="wrap">
    <header>
      <h1>✦ Decorações ✦</h1>
      <p>Clique em uma arte para ver o preço. A imagem vai direto para o seu perfil.</p>
      <div class="bal" id="bal">Carregando saldo…</div>
    </header>
    <div class="msg" id="status">Carregando catálogo…</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modal">
      <img id="mImg" alt="" />
      <div class="mbody">
        <h2 id="mName"></h2>
        <p id="mDesc"></p>
        <div class="mprice" id="mPrice"></div>
        <div class="modal-actions">
          <button class="btn-buy" id="mBuy">Comprar</button>
          <button class="btn-cancel" id="mCancel">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const guildId = params.get('guild') || '';
    let current = null;
    let currentOwned = false;

    if (guildId) {
      document.getElementById('linkDecor').href = '/decoracoes?guild=' + guildId;
      document.getElementById('linkItens').href = '/itens?guild=' + guildId;
    }

    document.getElementById('navToggle').onclick = () => {
      document.getElementById('navPanel').classList.toggle('open');
    };
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-menu')) {
        document.getElementById('navPanel').classList.remove('open');
      }
    });

    (function particles() {
      const c = document.getElementById('particles');
      const ctx = c.getContext('2d');
      let w, h, dots;
      function resize() {
        w = c.width = innerWidth;
        h = c.height = innerHeight;
        dots = Array.from({ length: Math.min(55, Math.floor(w / 28)) }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          r: Math.random() * 1.8 + 0.4, s: Math.random() * 0.35 + 0.1,
          a: Math.random() * 0.4 + 0.1
        }));
      }
      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const d of dots) {
          d.y -= d.s;
          if (d.y < -4) { d.y = h + 4; d.x = Math.random() * w; }
          ctx.beginPath();
          ctx.fillStyle = `rgba(196,181,253,${d.a})`;
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      resize(); addEventListener('resize', resize); tick();
    })();

    function toast(t) {
      const el = document.getElementById('toast');
      el.textContent = t;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2800);
    }
    function fmt(n) { return Number(n || 0).toLocaleString('pt-BR'); }

    function openModal(item, owned) {
      current = item; currentOwned = owned;
      document.getElementById('mImg').src = item.image;
      document.getElementById('mName').textContent = item.name;
      document.getElementById('mDesc').textContent = item.desc || '';
      document.getElementById('mPrice').textContent = owned ? 'Já na sua coleção' : `💠 ${fmt(item.price)}`;
      document.getElementById('mBuy').textContent = owned ? 'Equipar no perfil' : 'Comprar agora';
      document.getElementById('modalBg').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBg').classList.remove('open');
      current = null;
    }
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };

    document.getElementById('mBuy').onclick = async () => {
      if (!current) return;
      const item = current, owned = currentOwned;
      closeModal();
      if (owned) {
        const res = await fetch('/api/shop/equip', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: item.id })
        }).then((r) => r.json());
        toast(res.ok ? '✨ Equipado no perfil!' : (res.error || 'Erro'));
        if (res.ok) load();
        return;
      }
      const res = await fetch('/api/shop/buy', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId: item.id, guildId })
      }).then((r) => r.json());
      if (!res.ok) { toast(res.error || 'Falha na compra'); return; }
      toast('✨ Comprado e aplicado no perfil!');
      load();
    };

    async function load() {
      const me = await fetch('/api/me').then((r) => (r.ok ? r.json() : null)).catch(() => null);
      if (!me) {
        document.getElementById('status').textContent = 'Faça login no Discord para comprar.';
        document.getElementById('bal').textContent = 'Não autenticado';
      } else {
        document.getElementById('bal').innerHTML =
          `❄️ ${fmt(me.economy?.flocos)} · 💠 ${fmt(me.economy?.cristais)}`;
      }
      const url = guildId ? `/api/shop/decorations?guild=${guildId}` : '/api/shop/decorations';
      const data = await fetch(url).then((r) => r.json()).catch(() => null);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!data?.items?.length) {
        document.getElementById('status').textContent = 'Nenhuma decoração disponível.';
        return;
      }
      document.getElementById('status').textContent =
        `${data.items.length} artes · preços variam por imagem`;
      const owned = new Set(data.owned || []);
      const equipped = data.equipped?.decoration || null;
      data.items.forEach((item, i) => {
        const isOwned = owned.has(item.id);
        const isEq = equipped === item.id;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 0.05}s`;
        card.innerHTML = `
          <div class="img-wrap">
            ${isEq ? '<span class="badge equipped">EQUIPADA</span>' : isOwned ? '<span class="badge owned">NA COLEÇÃO</span>' : ''}
            <img src="${item.image}" alt="${item.name}" loading="lazy" />
          </div>
          <div class="body">
            <h3>${item.name}</h3>
            <p class="desc">${item.desc || ''}</p>
            <div class="price">💠 ${fmt(item.price)}</div>
          </div>`;
        card.onclick = () => openModal(item, isOwned);
        grid.appendChild(card);
      });
    }
    load();
  </script>
</body>
</html>
