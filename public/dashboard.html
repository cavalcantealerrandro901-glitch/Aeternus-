<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternus - Painel do Servidor</title>
    <link id="dynamicFavicon" rel="icon" href="">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/theme.js"></script>
    <style>
        body { background-color: var(--bg-color, #0f172a); color: var(--text-color, #f8fafc); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .top-bar { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 1000; display: flex; justify-content: space-between; }
        .top-btn { background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155); color: var(--text-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
        .content { margin-top: 80px; width: 100%; max-width: 520px; }
        .card { background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
        .bot-avatar, #serverIcon, #guild-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; background: #0f172a; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .stat-box { background: #0f172a; border-radius: 12px; padding: 12px; text-align: center; }
        .stat-value { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
        .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: inherit; cursor: pointer; font-size: 14px; text-align: left; }
        .menu-item:hover { border-color: #38bdf8; }
        .system-view { display: none; }
        .system-view.system-page { display: block; }
        .prefix-input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; }
        .btn-save { margin-top: 10px; background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        h2, h3 { margin: 0 0 8px; }
        .muted { color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="top-btn" href="/servers">← Servidores</a>
        <a class="top-btn" href="/">🏠 Início</a>
    </div>

    <div class="content" id="main-container">
        <!-- Home do servidor -->
        <div id="guild-view" class="system-view home-only" style="display:block;">
            <div class="card" style="text-align:center;">
                <img id="guild-avatar" src="" alt="">
                <h2 id="guild-name" style="margin-top:12px;">Carregando…</h2>
                <p id="guild-id" class="muted">ID: …</p>
                <div class="grid-stats">
                    <div class="stat-box"><div id="guild-members" class="stat-value">—</div><div class="stat-label">👥 Membros</div></div>
                    <div class="stat-box"><div id="guild-roles" class="stat-value">—</div><div class="stat-label">🛡️ Cargos</div></div>
                    <div class="stat-box"><div id="guild-channels" class="stat-value">—</div><div class="stat-label">💬 Canais</div></div>
                    <div class="stat-box"><div id="serverJoined" class="stat-value" style="font-size:13px;">—</div><div class="stat-label">📅 Bot entrou</div></div>
                </div>
                <p id="guild-desc" class="muted" style="margin-top:14px;"></p>
            </div>

            <div class="card" id="serverCard">
                <div style="display:flex;align-items:center;gap:12px;">
                    <img id="serverIcon" src="" alt="">
                    <div style="text-align:left;">
                        <h3 id="serverName">—</h3>
                        <span id="serverId" class="muted" style="font-family:monospace;font-size:12px;"></span>
                    </div>
                </div>
                <div class="grid-stats">
                    <div class="stat-box"><div id="serverMembers" class="stat-value">—</div><div class="stat-label">👥 Membros</div></div>
                    <div class="stat-box"><div id="serverChannels" class="stat-value">—</div><div class="stat-label">💬 Canais</div></div>
                    <div class="stat-box"><div id="serverRoles" class="stat-value">—</div><div class="stat-label">🛡️ Cargos</div></div>
                    <div class="stat-box"><div id="botPing" class="stat-value">—</div><div class="stat-label">📡 Ping</div></div>
                </div>
            </div>

            <div class="card" style="text-align:center;">
                <img id="botAvatar" class="bot-avatar" src="" alt="">
                <h3 id="botName">Bot</h3>
                <span id="botTag" class="muted"></span>
                <div class="grid-stats">
                    <div class="stat-box"><div id="botUptime" class="stat-value" style="font-size:14px;">—</div><div class="stat-label">⏱️ Uptime</div></div>
                </div>
            </div>

            <div class="card">
                <h3>⚙️ Sistemas</h3>
                <button type="button" class="menu-item" onclick="openSystem('system-geral')"><span>🔧</span> Geral · Prefixo</button>
                <button type="button" class="menu-item" onclick="openSystem('system-welcome')"><span>👋</span> Boas-vindas</button>
                <button type="button" class="menu-item" onclick="openSystem('system-logs')"><span>📋</span> Logs</button>
                <button type="button" class="menu-item" onclick="openSystem('system-music')"><span>🎵</span> Música · Fila</button>
            </div>
        </div>

        <!-- Prefixo rápido -->
        <div id="prefixCard" class="system-view card">
            <button type="button" class="top-btn" onclick="showGuildView()" style="margin-bottom:12px;">← Voltar</button>
            <h3>✏️ Prefixo do Bot</h3>
            <input type="text" id="prefixInput" class="prefix-input" maxlength="10" placeholder="O.">
            <button class="btn-save" type="button" onclick="savePrefix()">💾 Salvar prefixo</button>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Aceita ?guild= e ?server=
        const serverId = urlParams.get('guild') || urlParams.get('server');

        function safeText(id, val) {
            const el = document.getElementById(id);
            if (el) el.textContent = val ?? '—';
        }
        function safeSrc(id, val) {
            const el = document.getElementById(id);
            if (el && val) el.src = val;
        }

        async function loadGuild() {
            if (!serverId) {
                safeText('guild-name', 'Nenhum servidor selecionado');
                return;
            }

            try {
                const res = await fetch('/api/guild-details/' + encodeURIComponent(serverId), {
                    credentials: 'same-origin'
                });
                const data = await res.json();

                if (data.settings) {
                    window.originalSettings = { ...data.settings };
                }

                if (data.bot) {
                    safeSrc('botAvatar', data.bot.avatar);
                    safeText('botName', data.bot.name || data.bot.username);
                    safeText('botTag', data.bot.tag ? '@' + data.bot.tag : '');
                    safeText('botPing', (data.bot.ping ?? '—') + ' ms');
                    safeText('botUptime', data.bot.uptime || '—');
                }

                if (data.guild) {
                    const g = data.guild;
                    safeSrc('guild-avatar', g.icon);
                    safeSrc('serverIcon', g.icon);
                    safeText('guild-name', g.name);
                    safeText('serverName', g.name);
                    safeText('guild-id', 'ID: ' + g.id);
                    safeText('serverId', 'ID: ' + g.id);
                    safeText('guild-members', g.memberCount);
                    safeText('serverMembers', g.memberCount);
                    safeText('guild-channels', g.channelsCount);
                    safeText('serverChannels', g.channelsCount);
                    safeText('guild-roles', g.rolesCount);
                    safeText('serverRoles', g.rolesCount);
                    safeText('serverJoined', g.joinedAt || '—');
                    safeText('guild-desc', g.description || '');
                    const pi = document.getElementById('prefixInput');
                    if (pi) pi.value = g.prefix || 'O.';
                } else {
                    safeText('guild-name', 'Bot não está neste servidor');
                    const card = document.getElementById('serverCard');
                    if (card) card.innerHTML = '<p style="color:#ef4444">❌ O bot não está instalado neste servidor.</p>';
                }
            } catch (e) {
                console.error(e);
                safeText('guild-name', 'Erro ao carregar');
            }
        }

        async function savePrefix() {
            const newPrefix = document.getElementById('prefixInput').value;
            const res = await fetch('/api/set-setting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ guildId: serverId, key: 'prefix', value: newPrefix })
            });
            const data = await res.json();
            if (data.success) alert('✅ Prefixo salvo: ' + (data.prefix || newPrefix));
            else alert(data.error || 'Erro ao salvar');
        }

        // Carrega partials dos sistemas e depois os dados
        (async () => {
            if (typeof loadSystemPartials === 'function') {
                await loadSystemPartials();
            }
            await loadGuild();
        })();
    </script>
</body>
</html>
