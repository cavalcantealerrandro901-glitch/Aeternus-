<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Aeternus · RPG Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#07060f;--panel:rgba(14,10,28,.92);--line:rgba(255,255,255,.12);--accent:#c4b5fd;--ok:#34d399;--danger:#f43f5e;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rajdhani,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#1e1438 0%,var(--bg) 55%);color:#f1f5f9;min-height:100vh}
h1,h2,.brand{font-family:Cinzel,serif}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:1.15rem;letter-spacing:.12em;background:linear-gradient(90deg,#e9d5ff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:280px 1fr 300px;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(12px)}
.card h2{font-size:.95rem;margin-bottom:10px;opacity:.95}
.muted{color:var(--muted);font-size:.85rem}
.btn{appearance:none;border:1px solid var(--line);background:rgba(124,58,237,.25);color:#fff;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.ok{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.4)}
.btn.danger{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:#fff;padding:8px 10px;font-family:inherit}
.member{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent}
.member:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.av{width:40px;height:40px;border-radius:10px;background:#1a1230;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:1.3rem}
.av img{width:100%;height:100%;object-fit:cover}
.chat{height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{font-size:.9rem;line-height:1.3;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25)}
.msg.sys{opacity:.75;font-style:italic}
.msg b{color:var(--accent)}
.hidden{display:none !important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">✦ AETERNUS RPG</div>
    <div class="muted" id="roomLabel">Lobby</div>
  </div>
  <div id="lobby" class="card">
    <h2>Entrar no mundo</h2>
    <p class="muted">Crie uma sala, entre com o código ou use o link que o bot enviou.</p>
    <div class="row" style="margin-top:12px">
      <input id="displayName" placeholder="Seu nome na sala" style="max-width:220px" />
      <input id="joinCode" placeholder="Código da sala" style="max-width:140px" />
      <button class="btn ok" id="btnCreate">Criar sala</button>
      <button class="btn" id="btnJoin">Entrar</button>
    </div>
    <p class="muted" style="margin-top:10px">No Discord: <code>O.pvp</code> ou <code>O.rpg</code> abre o hub · <code>O.pvp @user</code> desafia.</p>
  </div>
  <div id="game" class="grid hidden">
    <div class="card">
      <h2>Personagem</h2>
      <div id="meBox" class="muted">—</div>
      <div class="row">
        <input id="editName" placeholder="Novo nome de batalha" />
        <button class="btn" id="btnSaveName">Salvar nome</button>
      </div>
      <p class="muted" style="margin-top:8px">Classe, nível e atributos vêm do perfil do bot (<code>O.j</code>).</p>
    </div>
    <div class="card">
      <h2>Chat da sala</h2>
      <div class="chat" id="chatBox"></div>
      <div class="row">
        <input id="chatInput" placeholder="Escreva uma mensagem…" />
        <button class="btn ok" id="btnSend">Enviar</button>
      </div>
    </div>
    <div class="card">
      <h2>Jogadores</h2>
      <div id="members"></div>
      <div class="row" style="margin-top:12px">
        <select id="targetSelect"></select>
        <button class="btn danger" id="btnDuel">Desafiar</button>
      </div>
      <div class="row">
        <button class="btn" id="btnArena" disabled>Abrir arena</button>
        <button class="btn" id="btnCopy">Copiar convite</button>
        <button class="btn danger" id="btnLeave">Sair</button>
      </div>
      <p class="muted" style="margin-top:8px" id="codeHint"></p>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  let me = qs.get('as') || localStorage.getItem('rpg_as') || '';
  let roomCode = qs.get('room') || localStorage.getItem('rpg_room') || '';
  let pollTimer = null;
  const el = (id) => document.getElementById(id);
  const toast = (t) => { const n = el('toast'); n.textContent = t; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 2200); };
  function saveLocal() {
    if (me) localStorage.setItem('rpg_as', me);
    if (roomCode) localStorage.setItem('rpg_room', roomCode);
  }
  async function api(path, opts) {
    const r = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Falha na API');
    return data;
  }
  function renderMembers(room) {
    const box = el('members');
    box.innerHTML = '';
    const sel = el('targetSelect');
    sel.innerHTML = '';
    (room.members || []).forEach((m) => {
      const d = document.createElement('div');
      d.className = 'member';
      const av = document.createElement('div');
      av.className = 'av';
      if (m.photo) { const img = document.createElement('img'); img.src = m.photo; av.appendChild(img); }
      else av.textContent = m.emoji || '⚔️';
      d.appendChild(av);
      const info = document.createElement('div');
      info.innerHTML = '<b>' + m.name + '</b><div class="muted">' + (m.emoji || '') + ' ' + (m.className || '') + ' · Nv.' + (m.level || 0) + (m.online ? '' : ' · offline') + '</div>';
      d.appendChild(info);
      box.appendChild(d);
      if (String(m.id) !== String(me)) {
        const o = document.createElement('option');
        o.value = m.id;
        o.textContent = m.name;
        sel.appendChild(o);
      }
    });
  }
  function renderChat(room) {
    const box = el('chatBox');
    box.innerHTML = '';
    (room.chat || []).forEach((m) => {
      const d = document.createElement('div');
      d.className = 'msg' + (m.system ? ' sys' : '');
      d.innerHTML = m.system ? m.text : '<b>' + m.name + ':</b> ' + m.text;
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }
  function renderMe(room) {
    const you = room.you || (room.members || []).find((m) => String(m.id) === String(me));
    if (!you) { el('meBox').textContent = '—'; return; }
    el('meBox').innerHTML =
      '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">' +
      '<div class="av">' + (you.photo ? '<img src="' + you.photo + '">' : (you.emoji || '⚔️')) + '</div>' +
      '<div><b>' + you.name + '</b><div class="muted">' + you.className + ' · Nv.' + you.level + '</div></div></div>';
  }
  function showGame(room) {
    el('lobby').classList.add('hidden');
    el('game').classList.remove('hidden');
    el('roomLabel').textContent = 'Sala ' + room.code + ' · ' + (room.name || '');
    el('codeHint').textContent = 'Código: ' + room.code + ' · Convide com o link ou O.rpg ' + room.code;
    renderMembers(room);
    renderChat(room);
    renderMe(room);
    const arenaBtn = el('btnArena');
    if (room.fightId) {
      arenaBtn.disabled = false;
      arenaBtn.onclick = () => {
        location.href = room.fightUrl || ('/pvp/' + room.fightId + '?as=' + encodeURIComponent(me));
      };
    } else arenaBtn.disabled = true;
  }
  async function refresh() {
    if (!roomCode || !me) return;
    try {
      const data = await api('/api/rpg/room/' + roomCode + '?as=' + encodeURIComponent(me));
      showGame(data);
    } catch (e) { toast(e.message || 'Sala offline'); }
  }
  async function createRoom() {
    const name = el('displayName').value.trim() || 'Aventureiro';
    if (!me) me = 'web_' + Math.random().toString(36).slice(2, 10);
    try {
      const data = await api('/api/rpg/create', { method: 'POST', body: { userId: me, name } });
      roomCode = data.code;
      saveLocal();
      history.replaceState({}, '', '/rpg?room=' + roomCode + '&as=' + encodeURIComponent(me));
      showGame(data.room);
      startPoll();
      toast('Sala criada: ' + roomCode);
    } catch (e) { toast(e.message); }
  }
  async function joinRoom(code) {
    code = (code || el('joinCode').value || roomCode || '').trim();
    const name = el('displayName').value.trim() || 'Aventureiro';
    if (!code) return toast('Informe o código');
    if (!me) me = 'web_' + Math.random().toString(36).slice(2, 10);
    try {
      const data = await api('/api/rpg/join', { method: 'POST', body: { code, userId: me, name } });
      roomCode = data.room.code;
      saveLocal();
      history.replaceState({}, '', '/rpg?room=' + roomCode + '&as=' + encodeURIComponent(me));
      showGame(data.room);
      startPoll();
      toast('Entrou na sala');
    } catch (e) { toast(e.message); }
  }
  function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refresh, 2500);
  }
  el('btnCreate').onclick = createRoom;
  el('btnJoin').onclick = () => joinRoom();
  el('btnSend').onclick = async () => {
    const text = el('chatInput').value.trim();
    if (!text) return;
    try {
      const data = await api('/api/rpg/chat', { method: 'POST', body: { code: roomCode, userId: me, text } });
      el('chatInput').value = '';
      showGame(data.room);
    } catch (e) { toast(e.message); }
  };
  el('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('btnSend').click(); });
  el('btnSaveName').onclick = async () => {
    const name = el('editName').value.trim();
    if (!name) return toast('Digite um nome');
    try {
      const data = await api('/api/rpg/profile', { method: 'POST', body: { code: roomCode, userId: me, name } });
      showGame(data.room);
      toast('Nome atualizado na sala');
    } catch (e) { toast(e.message); }
  };
  el('btnDuel').onclick = async () => {
    const targetId = el('targetSelect').value;
    if (!targetId) return toast('Escolha um oponente');
    try {
      const data = await api('/api/rpg/duel', { method: 'POST', body: { code: roomCode, aId: me, bId: targetId } });
      showGame(data.room);
      toast('Duelo iniciado!');
      if (data.urlA) setTimeout(() => { location.href = data.urlA; }, 600);
    } catch (e) { toast(e.message); }
  };
  el('btnCopy').onclick = async () => {
    const url = location.origin + '/rpg?room=' + roomCode;
    try { await navigator.clipboard.writeText(url); toast('Link copiado!'); }
    catch (_) { prompt('Copie o link:', url); }
  };
  el('btnLeave').onclick = async () => {
    try { await api('/api/rpg/leave', { method: 'POST', body: { code: roomCode, userId: me } }); } catch (_) {}
    roomCode = '';
    localStorage.removeItem('rpg_room');
    el('game').classList.add('hidden');
    el('lobby').classList.remove('hidden');
    el('roomLabel').textContent = 'Lobby';
    if (pollTimer) clearInterval(pollTimer);
  };
  if (qs.get('as')) { me = qs.get('as'); saveLocal(); }
  if (roomCode && me) joinRoom(roomCode);
})();
</script>
</body>
</html>
