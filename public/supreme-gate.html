<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUPREME GATE · Aeternus</title>
  <link rel="stylesheet" href="/css/panel.css">
  <style>
    .gate-nav { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .gate-nav button {
      border:1px solid var(--border); background:var(--bg2); color:var(--text);
      padding:8px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;
    }
    .gate-nav button.active { border-color:var(--accent); color:var(--accent); }
    .tab { display:none; } .tab.active { display:block; }
    .stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    @media(min-width:700px){ .stats-row { grid-template-columns:repeat(4,1fr); } }
  </style>
</head>
<body class="panel-body">
  <header class="panel-top">
    <div class="panel-brand">🌌 SUPREME GATE</div>
    <div class="panel-actions">
      <a class="btn" id="backDash" href="/dashboard">← Painel</a>
      <a class="btn" href="/servers">Servidores</a>
    </div>
  </header>

  <main class="panel-wrap">
    <div class="card">
      <div class="row-between">
        <div>
          <h2 style="margin:0 0 4px">👑 Personalização de perfil</h2>
          <p class="hint" style="margin:0" id="guildLabel">…</p>
        </div>
        <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
      </div>
      <div class="stats-row" style="margin-top:14px">
        <div class="stat"><b id="stJoins">0</b><span>👋 Entradas</span></div>
        <div class="stat"><b id="stLeaves">0</b><span>🚪 Saídas</span></div>
        <div class="stat"><b id="stVerified">0</b><span>🔐 Verificados</span></div>
        <div class="stat"><b id="stStatus">OFF</b><span>Status</span></div>
      </div>
    </div>

    <div class="gate-nav" id="nav">
      <button type="button" data-tab="portal" class="active">🌌 Portal</button>
      <button type="button" data-tab="roles">🛡️ Cargos</button>
      <button type="button" data-tab="rules">📜 Regras</button>
      <button type="button" data-tab="leave">🚪 Saída</button>
      <button type="button" data-tab="logs">📊 Logs</button>
    </div>

    <div class="tab active" id="tab-portal">
      <div class="card">
        <p class="hint">Fluxo: loading 3s → cargos paginados → regras → perfil concluído (mesma mensagem).</p>
        <div class="field"><label>Canal do portal</label><select id="wChannel"></select></div>
        <div class="field"><label>Cor do embed</label><input id="wColor" placeholder="#7c3aed"></div>
        <div class="field row-between">
          <span>Mencionar membro</span>
          <label class="switch"><input type="checkbox" id="wPing" checked><span class="slider"></span></label>
        </div>
      </div>
    </div>

    <div class="tab" id="tab-roles">
      <div class="card">
        <div class="field"><label>Cargo visitante</label><select id="roleVisitor"></select></div>
        <div class="field"><label>Cargo verificado</label><select id="roleVerified"></select></div>
        <div class="field"><label>Máx. cargos selecionáveis</label><input type="number" id="roleMax" min="1" max="25" value="15"></div>
        <div class="field">
          <label>Páginas de cargos (máx. 5 por página)</label>
          <textarea id="rolePages" rows="16" placeholder="--- PERSONALIDADE ---&#10;Explorador|ID|🌌&#10;Místico|ID|🔮&#10;&#10;--- INTERESSES ---&#10;Gamer|ID|🎮"></textarea>
          <p class="hint">Separe páginas com <code>--- TÍTULO ---</code> e cargos com <code>Nome|ID|emoji</code></p>
        </div>
      </div>
    </div>

    <div class="tab" id="tab-rules">
      <div class="card">
        <div class="field"><label>Cor</label><input id="rColor" placeholder="#38bdf8"></div>
        <div class="field">
          <label>Regras (Título|Texto) — 3 por página</label>
          <textarea id="rItems" rows="10" placeholder="Respeito|Respeite todos.&#10;Spam|Evite mensagens repetidas."></textarea>
        </div>
      </div>
    </div>

    <div class="tab" id="tab-leave">
      <div class="card">
        <div class="field"><label>Canal</label><select id="lChannel"></select></div>
        <div class="field"><label>Título</label><input id="lTitle"></div>
        <div class="field"><label>Descrição</label><textarea id="lDesc" rows="4"></textarea></div>
        <div class="field"><label>Cor</label><input id="lColor"></div>
      </div>
    </div>

    <div class="tab" id="tab-logs">
      <div class="card">
        <div class="field"><label>Canal de logs</label><select id="logChannel"></select></div>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">
      <button type="button" class="btn btn-primary" id="btnSave">💾 Salvar</button>
      <button type="button" class="btn" id="btnTest">🧪 Testar fluxo</button>
    </div>
  </main>
  <div class="toast" id="toast">OK</div>
  <script src="/js/supreme-gate.js"></script>
</body>
</html>
