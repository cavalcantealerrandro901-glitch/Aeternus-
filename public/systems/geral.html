<div id="system-geral" class="system-view" style="display: none;">
    <button class="back-btn" type="button" onclick="showGuildView()">← Voltar ao Início</button>
    <h2>⚙️ Configurações Gerais</h2>
    <p style="color:#9ca3af;font-size:13px;margin-top:0">
        Prefixo padrão: <code>O.</code> — você pode mudar para qualquer um (até 10 caracteres).<br>
        Exemplos: <code>O.ping</code>, <code>!ping</code>, <code>?ping</code>
    </p>
    <div class="input-group">
        <label>Prefixo do Bot</label>
        <input type="text" id="prefix" data-key="prefix" placeholder="O." maxlength="10" value="O.">
        <p style="font-size:12px;color:#94a3b8;margin:8px 0 0">
            Deixe em branco no salvamento para voltar ao padrão <strong>O.</strong>
        </p>
    </div>
</div>
