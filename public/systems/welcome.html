<div id="system-welcome" class="system-view" style="display: none;">
            <button class="back-btn" onclick="showGuildView()">← Voltar ao Início</button>
            <h2>👋 Sistema de Boas-Vindas</h2>
            <div class="input-group">
                <label>Canal de Boas-vindas (ID)</label>
                <input type="text" id="welcomeChannel" data-key="welcomeChannel" placeholder="Ex: 123456789">
            </div>
            <div class="input-group">
                <label>Mensagem de Boas-vindas</label>
                <textarea id="welcomeMessage" data-key="welcomeMessage" rows="3" placeholder="Ex: Olá {user}!"></textarea>
            </div>
        </div>
