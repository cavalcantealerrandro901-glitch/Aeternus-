<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternus</title>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <style>
        body {
            background: var(--bg-color, #0f172a);
            color: var(--text-color, #f8fafc);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .top-bar { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; }
        .top-btn {
            background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155);
            color: var(--text-color, #f8fafc); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold;
        }
        .btn-login-top { background: #38bdf8 !important; color: #0f172a !important; border: none !important; }
        .dropdown-menu {
            display: none; position: absolute; top: 60px; right: 20px; width: 260px;
            background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155);
            border-radius: 12px; padding: 10px; z-index: 1001; box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }
        .dropdown-menu.active { display: block; }
        .dropdown-item {
            padding: 11px 12px; color: var(--text-color, #f8fafc); cursor: pointer; border: none;
            background: none; font-size: 14px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
            width: 100%; text-align: left; text-decoration: none; box-sizing: border-box;
        }
        .dropdown-item:hover { background: rgba(56,189,248,.12); color: #38bdf8; }
        .dropdown-item .e { width: 22px; text-align: center; }
        .dropdown-sep { border-top: 1px solid var(--border-color, #334155); margin: 8px 0; }
        .hero { text-align: center; margin-top: 90px; max-width: 720px; width: 100%; }
        .bot-avatar {
            width: 128px; height: 128px; border-radius: 50%; border: 3px solid #38bdf8;
            object-fit: cover; margin-bottom: 18px;
        }
        .hero h1 { margin: 0; font-size: 2.4rem; letter-spacing: 3px; color: #38bdf8; }
        .phrase { margin: 24px auto; max-width: 560px; color: #94a3b8; font-size: 1.05rem; line-height: 1.6; }
        .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
        .cta a {
            background: #38bdf8; color: #0f172a; padding: 12px 22px; border-radius: 24px;
            text-decoration: none; font-weight: bold;
        }
        .cta a.secondary { background: transparent; border: 1px solid #334155; color: #f8fafc; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a id="loginTop" class="top-btn btn-login-top" href="/auth/discord">🔐 Login</a>
        <button class="top-btn" type="button" onclick="toggleMenu()">☰ Menu</button>
    </div>

    <div id="dropdownMenu" class="dropdown-menu">
        <a href="/loja.html" class="dropdown-item"><span class="e">🛒</span> Loja</a>
        <a href="/gaming.html" class="dropdown-item"><span class="e">🎮</span> Gaming</a>
        <a href="/wiki.html" class="dropdown-item"><span class="e">📖</span> Wiki</a>
        <a href="/api-premium.html" class="dropdown-item"><span class="e">⚡</span> API Premium</a>
        <a href="/daily.html" class="dropdown-item"><span class="e">🎁</span> Daily</a>
        <div class="dropdown-sep"></div>
        <button type="button" class="dropdown-item" onclick="location.href='/commands.html'"><span class="e">📜</span> Comandos</button>
        <a href="/dashboard" class="dropdown-item"><span class="e">⚙️</span> Painel</a>
        <a href="/servers" class="dropdown-item"><span class="e">🛡️</span> Servidores</a>
        <button type="button" class="dropdown-item" onclick="openLanguages()"><span class="e">🌐</span> Idioma</button>
        <button type="button" class="dropdown-item" onclick="toggleTheme()" id="themeLabel"><span class="e">🌙</span> Tema</button>
        <div class="dropdown-sep"></div>
        <a href="/auth/logout" class="dropdown-item" style="color:#ef4444"><span class="e">🚪</span> Sair</a>
    </div>

    <div class="hero">
        <img id="botAvatar" class="bot-avatar" src="" alt="Bot">
        <h1 id="botName">Aeternus</h1>
        <p class="phrase" id="homePhrase">Bot de economia com ❄️ flocos, jogos e painel web.</p>
        <div class="cta">
            <a id="inviteBtn" href="#">➕ Adicionar ao servidor</a>
            <a class="secondary" href="/daily.html">🎁 Daily</a>
            <a class="secondary" href="https://discord.gg/" id="supportBtn" target="_blank" rel="noopener">💬 Suporte</a>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdownMenu');
            if (!menu.contains(e.target) && !e.target.closest('.top-bar')) menu.classList.remove('active');
        });
        function toggleTheme() {
            if (typeof window.__toggleTheme === 'function') window.__toggleTheme();
            const dark = document.documentElement.dataset.theme !== 'light';
            document.getElementById('themeLabel').innerHTML = dark
                ? '<span class="e">🌙</span> Escuro'
                : '<span class="e">☀️</span> Claro';
        }
        function openLanguages() {
            alert('Idiomas: use o seletor quando disponível no painel.');
        }
        (async () => {
            try {
                const me = await fetch('/auth/me').then(r => r.json());
                if (me.authenticated) {
                    const btn = document.getElementById('loginTop');
                    btn.textContent = '👤 Conta';
                    btn.href = '/servers';
                    btn.classList.remove('btn-login-top');
                }
            } catch (_) {}
            try {
                const info = await fetch('/api/bot-info').then(r => r.json());
                if (info.avatar) document.getElementById('botAvatar').src = info.avatar;
                if (info.name) document.getElementById('botName').textContent = info.name;
                if (info.phrase) document.getElementById('homePhrase').textContent = info.phrase;
                if (info.inviteUrl) document.getElementById('inviteBtn').href = info.inviteUrl;
            } catch (_) {}
        })();
    </script>
</body>
</html>
