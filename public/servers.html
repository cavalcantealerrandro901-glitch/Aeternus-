<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidores · Aeternus</title>
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body class="panel-body">
  <header class="panel-top">
    <div class="panel-brand">AETERNUS</div>
    <div class="panel-actions">
      <a class="btn" href="/">🏠 Início</a>
      <a class="btn" href="/auth/logout">🚪 Sair</a>
    </div>
  </header>

  <main class="panel-wrap">
    <div class="card" style="text-align:center;margin-bottom:18px;">
      <h1 style="margin:0 0 6px;font-size:1.5rem;">🛡️ Seus servidores</h1>
      <p class="muted" style="margin:0;color:var(--muted);font-size:14px;">
        Apenas servidores em que você é <b>administrador</b> e o bot está presente.
      </p>
    </div>
    <div id="list" class="server-list">Carregando…</div>
    <p class="footer-note">Aeternus Panel</p>
  </main>

  <script>
    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }
    function iconUrl(s) {
      if (s.iconUrl) return s.iconUrl;
      if (!s.icon) return null;
      if (String(s.icon).startsWith('http')) return s.icon;
      const ext = String(s.icon).startsWith('a_') ? 'gif' : 'png';
      return `https://cdn.discordapp.com/icons/${s.id}/${s.icon}.${ext}?size=128`;
    }
    async function load() {
      const box = document.getElementById('list');
      try {
        const me = await fetch('/auth/me', { credentials: 'same-origin' }).then(r => r.json());
        if (!me.authenticated) return location.href = '/auth/discord';

        let servers = [];
        for (const url of ['/api/servers', '/api/user/servers']) {
          const res = await fetch(url, { credentials: 'same-origin' });
          if (res.status === 401) return location.href = '/auth/discord';
          if (!res.ok) continue;
          const data = await res.json();
          if (Array.isArray(data)) { servers = data; break; }
          if (Array.isArray(data.servers)) { servers = data.servers; break; }
        }

        if (!servers.length) {
          box.innerHTML = `<div class="empty">Nenhum servidor encontrado.<br><br>
            Confira se você é admin e se o bot está no servidor.</div>`;
          return;
        }

        box.innerHTML = servers.map(s => {
          const url = iconUrl(s);
          const icon = url
            ? `<img class="server-icon" src="${esc(url)}" alt="" onerror="this.className='server-icon fallback';this.removeAttribute('src');this.textContent='${esc((s.name||'?')[0]||'?')}'">`
            : `<div class="server-icon fallback">${esc((s.name||'?')[0]||'?')}</div>`;
          return `<a class="server-item" href="/dashboard?guild=${encodeURIComponent(s.id)}">
            <div class="server-left">${icon}
              <div style="min-width:0">
                <div class="server-name">${esc(s.name||'Servidor')}</div>
                <div class="server-id">${esc(s.id)}${s.owner?' · Dono':''}</div>
              </div>
            </div>
            <span style="color:var(--accent);font-weight:700">→</span>
          </a>`;
        }).join('');
      } catch (e) {
        box.innerHTML = `<div class="empty">Erro ao carregar. Tente novamente.</div>`;
      }
    }
    load();
  </script>
</body>
</html>
