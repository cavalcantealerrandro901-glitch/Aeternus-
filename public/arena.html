<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Arena Aeternus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:wght@400;600&display=swap');
  :root {
    --bg:#0a0806; --card:#1a1410; --gold:#c9a227; --gold-dim:#8b6914;
    --hp:#22c55e; --hp-bg:#14532d; --mana:#3b82f6; --mana-bg:#1e3a8a;
    --ink:#f5e6c8; --muted:#a89f91;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100dvh;background:radial-gradient(ellipse 80% 50% at 50% 20%,#2a1810 0%,transparent 60%),var(--bg);
    color:var(--ink);font-family:'Crimson Text',Georgia,serif;overflow-x:hidden;
  }
  .top-banner{
    position:sticky;top:0;z-index:50;min-height:44px;display:flex;align-items:center;justify-content:center;
    padding:.5rem .75rem;background:linear-gradient(180deg,#1c140c,#120e0aee);border-bottom:1px solid var(--gold-dim);
  }
  .top-banner .msg{font-family:Cinzel,serif;font-size:.85rem;text-align:center;color:var(--gold);max-width:920px}
  .top-banner .msg.hit{color:#fca5a5}.top-banner .msg.heal{color:#86efac}.top-banner .msg.win{color:#fbbf24}
  .sub-bar{display:flex;justify-content:center;gap:1rem;padding:.3rem;font-size:.8rem;color:var(--muted);border-bottom:1px solid #c9a22722}
  .sub-bar strong{color:var(--gold);font-family:Cinzel,serif}

  /* Dois cards lado a lado — PC e mobile */
  .arena{
    display:grid;grid-template-columns:1fr 1fr;gap:.5rem;
    max-width:720px;margin:.5rem auto;padding:0 .5rem 7.5rem;align-items:start;
  }
  @media (min-width:900px){
    .arena{max-width:900px;gap:.75rem;padding-bottom:6rem}
  }
  .card{
    background:linear-gradient(165deg,#241c14 0%,#120e0a 55%,#0c0a08 100%);
    border:1.5px solid var(--gold-dim);border-radius:12px;padding:.55rem;
    box-shadow:0 8px 24px #000a;display:flex;flex-direction:column;align-items:center;gap:.35rem;
    width:100%;max-width:100%;min-width:0;
  }
  .card.enemy{border-color:#7f1d1d}
  .card.active-turn{border-color:var(--gold);box-shadow:0 0 0 2px #c9a22755 inset,0 0 24px #c9a22733}
  .card .name{font-family:Cinzel,serif;font-size:.82rem;color:var(--gold);text-align:center;line-height:1.2}
  .card .class-line{font-size:.68rem;color:var(--muted);margin-top:-.15rem;text-align:center}
  .card .portrait{
    width:72px;height:72px;border-radius:10px;border:1.5px solid var(--gold);
    object-fit:cover;background:#000;
  }
  @media (min-width:700px){ .card .portrait{width:100px;height:100px} }
  .card.enemy .portrait{border-color:#b91c1c}
  .card .portrait.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .stat-block{width:100%}
  .stat-row{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-bottom:.1rem;font-family:Cinzel,serif}
  .stat-row span:last-child{color:var(--ink)}
  .bar{height:12px;border-radius:6px;background:#000c;border:1px solid #ffffff12;overflow:hidden;margin-bottom:.3rem}
  .bar>i{display:block;height:100%;width:100%;transform-origin:left center;transition:transform .5s cubic-bezier(.2,.85,.2,1)}
  .bar.hp>i{background:linear-gradient(90deg,var(--hp-bg),var(--hp))}
  .bar.mana>i{background:linear-gradient(90deg,var(--mana-bg),var(--mana))}
  .attrs-mini{display:flex;flex-wrap:wrap;gap:.2rem;justify-content:center;width:100%}
  .attrs-mini span{font-size:.62rem;padding:.08rem .28rem;border-radius:5px;background:#0006;border:1px solid #c9a22728;color:var(--muted)}
  .pass-row{display:flex;flex-wrap:wrap;gap:.18rem;justify-content:center;width:100%;min-height:1rem}
  .pass-row .chip{font-size:.6rem;padding:.1rem .28rem;border-radius:999px;background:#2e1065;border:1px solid #7c3aed44;color:#e9d5ff}
  .card-actions{width:100%;display:flex;flex-direction:column;gap:.25rem;margin-top:.15rem}
  .card-actions button{
    font-family:Cinzel,serif;font-size:.65rem;padding:.4rem .3rem;border-radius:7px;
    border:1px solid var(--gold-dim);background:linear-gradient(180deg,#3a2a12,#1a1208);
    color:var(--ink);cursor:pointer;width:100%;text-align:left;line-height:1.25;
  }
  .card-actions button:hover:not(:disabled){border-color:var(--gold)}
  .card-actions button:disabled{opacity:.35;cursor:not-allowed}
  .card-actions button.basic{background:linear-gradient(180deg,#5c1a1a,#1a0a0a);border-color:#9b1c1c}
  .card.enemy .card-actions{display:none}
  .dmg-tag{color:#fbbf24;font-weight:700}

  .lobby{max-width:420px;margin:2rem auto;padding:1.25rem;background:var(--card);border:1px solid var(--gold-dim);border-radius:12px;text-align:center}
  .lobby input,.lobby button{font-family:inherit;padding:.45rem .65rem;margin:.25rem;border-radius:8px;border:1px solid var(--gold-dim);background:#0c0a09;color:var(--ink)}
  .lobby button{background:linear-gradient(180deg,#3a2a12,#1a1208);cursor:pointer;font-family:Cinzel,serif}
  .hidden{display:none!important}

  /* Chat canto inferior esquerdo */
  .chat-panel{
    position:fixed;left:8px;bottom:8px;z-index:60;width:min(280px,46vw);
    max-height:38vh;display:flex;flex-direction:column;
    background:#120e0af2;border:1px solid #c9a22744;border-radius:12px;overflow:hidden;
  }
  .chat-log{flex:1;overflow-y:auto;padding:.4rem .5rem;font-size:.72rem;line-height:1.35;max-height:28vh}
  .chat-log .line{margin-bottom:.25rem;word-break:break-word}
  .chat-log .line b{color:var(--gold)}
  .chat-log .line.spec b{color:#a78bfa}
  .chat-form{display:flex;border-top:1px solid #c9a22733}
  .chat-form input{flex:1;border:0;background:#0c0a09;color:var(--ink);padding:.4rem .5rem;font-size:.75rem;outline:none}
  .chat-form button{border:0;background:#3a2a12;color:var(--gold);padding:.4rem .55rem;cursor:pointer;font-family:Cinzel,serif;font-size:.7rem}

  /* Emojis canto inferior direito */
  .emoji-bar{
    position:fixed;right:8px;bottom:8px;z-index:60;display:flex;flex-wrap:wrap;gap:6px;
    max-width:150px;justify-content:flex-end;
  }
  .emoji-bar button{
    width:40px;height:40px;border-radius:50%;border:1px solid #c9a22755;
    background:#1a1410ee;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 12px #0008;
  }
  .emoji-bar button:active{transform:scale(.92)}
  .float-emoji{
    position:fixed;z-index:70;font-size:1.6rem;pointer-events:none;
    animation:floatUp 4.2s ease-out forwards;
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translateY(0) scale(1)}
    70%{opacity:.9}
    100%{opacity:0;transform:translateY(-120px) scale(1.25)}
  }
</style>
</head>
<body>
<div class="top-banner"><div class="msg" id="topMsg">⚔ Arena Aeternus</div></div>
<div class="sub-bar">
  <span>Turno: <strong id="turnName">—</strong></span>
  <span>Tempo: <strong id="timer">--</strong>s</span>
</div>
<div id="lobby" class="lobby">
  <p style="margin-bottom:.8rem;color:var(--muted);font-size:.9rem">Entre com o ID da arena e seu User ID:</p>
  <input id="matchIdInput" placeholder="ID da arena" style="width:85%" />
  <input id="asInput" placeholder="Seu Discord User ID" style="width:85%" /><br/>
  <button id="joinBtn">Entrar</button>
</div>
<div id="battle" class="arena hidden">
  <article class="card" id="cardA">
    <div class="name" id="nameA">—</div>
    <div class="class-line" id="classA">—</div>
    <img class="portrait" id="avatarA" alt="" src="" />
    <div class="stat-block">
      <div class="stat-row"><span>Vida</span><span id="hpTextA">0/0</span></div>
      <div class="bar hp"><i id="hpBarA"></i></div>
      <div class="stat-row"><span>Mana</span><span id="manaTextA">0/0</span></div>
      <div class="bar mana"><i id="manaBarA"></i></div>
    </div>
    <div class="attrs-mini" id="attrsA"></div>
    <div class="pass-row" id="passA"></div>
    <div class="card-actions" id="actionsA"></div>
  </article>
  <article class="card enemy" id="cardB">
    <div class="name" id="nameB">—</div>
    <div class="class-line" id="classB">—</div>
    <img class="portrait" id="avatarB" alt="" src="" />
    <div class="stat-block">
      <div class="stat-row"><span>Vida</span><span id="hpTextB">0/0</span></div>
      <div class="bar hp"><i id="hpBarB"></i></div>
      <div class="stat-row"><span>Mana</span><span id="manaTextB">0/0</span></div>
      <div class="bar mana"><i id="manaBarB"></i></div>
    </div>
    <div class="attrs-mini" id="attrsB"></div>
    <div class="pass-row" id="passB"></div>
    <div class="card-actions" id="actionsB"></div>
  </article>
</div>

<div id="chatPanel" class="chat-panel hidden">
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-form" id="chatForm">
    <input id="chatInput" maxlength="200" placeholder="Mensagem..." autocomplete="off" />
    <button type="submit">Enviar</button>
  </form>
</div>
<div id="emojiBar" class="emoji-bar hidden">
  <button type="button" data-e="🔥">🔥</button>
  <button type="button" data-e="😂">😂</button>
  <button type="button" data-e="👏">👏</button>
  <button type="button" data-e="😱">😱</button>
  <button type="button" data-e="💀">💀</button>
  <button type="button" data-e="✨">✨</button>
</div>

<script>
const qs=new URLSearchParams(location.search);
let matchId=qs.get('id')||qs.get('dungeon')||'';
let asUser=qs.get('as')||'';
let isDungeon=!!qs.get('dungeon');
let state=null,lastFxKey='',pollTimer=null,tickTimer=null,seenReact=new Set();
const $=id=>document.getElementById(id);

function barScale(el,cur,max){el.style.transform='scaleX('+Math.max(0,Math.min(1,(cur||0)/Math.max(1,max||1)))+')'}
function dmgLabel(a){
  const p=Number(a&&a.power);
  if(Number.isFinite(p)&&p>0) return ' <span class="dmg-tag">💥'+Math.round(p*100)+'</span>';
  if(a&&(a.type==='heal'||a.type==='buff')) return ' <span class="dmg-tag">✨</span>';
  return '';
}
function setCard(side,f,isYou){
  if(!f) return;
  $('name'+side).textContent=(f.emoji||'')+' '+f.name;
  $('class'+side).textContent=(f.className||'—')+' · Nv.'+(f.level||0);
  $('avatar'+side).src=(f.battleAvatar&&f.battleAvatar.imageUrl)||f.photo||'https://placehold.co/100x100/1a1410/c9a227/png?text=?';
  $('hpText'+side).textContent=f.hp+' / '+f.maxHp;
  $('manaText'+side).textContent=f.mana+' / '+f.maxMana;
  barScale($('hpBar'+side),f.hp,f.maxHp);
  barScale($('manaBar'+side),f.mana,f.maxMana);
  const a=f.attrs||{};
  // mesmos attrs do perfil O.j
  $('attrs'+side).innerHTML=[
    ['💪',a.forca],['⚡',a.agilidade],['🛡️',a.constituicao??a.defesa],
    ['🧠',a.inteligencia],['✨',a.espirito],['🍀',a.sorte]
  ].map(([e,v])=>'<span>'+e+' '+(v??0)+'</span>').join('');
  const pass=(f.passives||[]).filter(Boolean);
  $('pass'+side).innerHTML=pass.map(p=>'<span class="chip">'+(p.emoji||'')+' '+p.name+'</span>').join('');
  const card=$('card'+side);
  card.classList.toggle('active-turn',!!(state&&state.yourTurn&&isYou&&state.status==='active'));
  const box=$('actions'+side);
  box.innerHTML='';
  if(!isYou||!state||state.status!=='active') return;
  if(!state.yourTurn){box.innerHTML='<button disabled>Aguardando…</button>';return;}
  const basic=f.basicAttack||{id:'basic',name:'Ataque',emoji:'⚔️',power:1};
  const b=document.createElement('button');
  b.className='basic';
  b.innerHTML=(basic.emoji||'⚔️')+' '+(basic.name||'Ataque')+dmgLabel(basic);
  b.onclick=()=>doMove(basic.id==='basic'? 'basic':basic.id);
  box.appendChild(b);
  (f.actives||[]).forEach(ab=>{
    const btn=document.createElement('button');
    const cd=ab.currentCd||0;
    btn.disabled=cd>0||(f.mana<(ab.mana||0));
    btn.innerHTML=(ab.emoji||'')+' '+ab.name+dmgLabel(ab)+(cd?' · CD'+cd:'')+' · 💧'+(ab.mana||0);
    btn.title=ab.desc||'';
    btn.onclick=()=>doMove(ab.id);
    box.appendChild(btn);
  });
}
function setTop(text,cls){
  const el=$('topMsg');
  el.className='msg'+(cls?' '+cls:'');
  el.textContent=text;
}
function renderChat(list){
  const log=$('chatLog');
  log.innerHTML=(list||[]).map(m=>{
    const spec=m.spectator?' spec':'';
    return '<div class="line'+spec+'"><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>';
  }).join('');
  log.scrollTop=log.scrollHeight;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function spawnFloatEmoji(emoji){
  const el=document.createElement('div');
  el.className='float-emoji';
  el.textContent=emoji;
  el.style.right=(12+Math.random()*70)+'px';
  el.style.bottom=(60+Math.random()*40)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4200);
}
function playReactions(list){
  (list||[]).forEach(r=>{
    if(!r||!r.id||seenReact.has(r.id)) return;
    seenReact.add(r.id);
    spawnFloatEmoji(r.emoji);
  });
}
function applyState(s){
  state=s;
  let left,right;
  if(isDungeon){left=s.player;right=s.monster;}
  else{
    const a=s.teamA&&s.teamA[0], b=s.teamB&&s.teamB[0];
    if(a&&a.id===asUser){left=a;right=b;}
    else if(b&&b.id===asUser){left=b;right=a;}
    else{left=a;right=b;}
  }
  setCard('A',left,left&&left.id===asUser);
  setCard('B',right,false);
  const curName=isDungeon
    ?(s.currentId===s.player?.id?s.player?.name:s.monster?.name)
    :([...(s.teamA||[]),...(s.teamB||[])].find(f=>f.id===s.currentId)?.name||'—');
  $('turnName').textContent=curName||'—';
  if(s.status==='finished'){
    let youWon=isDungeon?s.winnerTeam==='A'
      :((s.winnerTeam==='A'?s.teamA:s.teamB)||[]).some(f=>f.id===asUser);
    setTop(youWon?'🏆 Vitória!':'💀 Derrota...','win');
  }else if(s.yourTurn) setTop('Sua vez — escolha uma habilidade','');
  else if(s.log&&s.log.length) setTop(s.log[s.log.length-1].text||'','');
  renderChat(s.chat);
  playReactions(s.reactions);
}
async function doMove(moveId){
  if(!matchId||!asUser) return;
  const url=isDungeon?'/api/dungeon/'+matchId+'/move':'/api/arena/'+matchId+'/move';
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:asUser,moveId})});
    const data=await res.json();
    if(!data.ok){setTop(data.error||'Erro','hit');return;}
    applyState(data.match);
  }catch(_){setTop('Falha de rede','hit');}
}
async function poll(){
  if(!matchId) return;
  const url=isDungeon?'/api/dungeon/'+matchId+'?as='+encodeURIComponent(asUser):'/api/arena/'+matchId+'?as='+encodeURIComponent(asUser);
  try{const res=await fetch(url);if(res.ok) applyState(await res.json());}catch(_){}
}
function tick(){
  if(!state||!state.turnEndsAt) return;
  $('timer').textContent=Math.max(0,Math.ceil((state.turnEndsAt-Date.now())/1000));
}
function enter(){
  matchId=$('matchIdInput').value.trim()||matchId;
  asUser=$('asInput').value.trim()||asUser;
  if(!matchId||!asUser){alert('Informe o ID e seu User ID');return;}
  isDungeon=matchId.startsWith('dg_')||isDungeon;
  $('lobby').classList.add('hidden');
  $('battle').classList.remove('hidden');
  $('chatPanel').classList.remove('hidden');
  $('emojiBar').classList.remove('hidden');
  poll();clearInterval(pollTimer);clearInterval(tickTimer);
  pollTimer=setInterval(poll,2000);tickTimer=setInterval(tick,400);
}
$('joinBtn').onclick=enter;
$('chatForm').onsubmit=async(ev)=>{
  ev.preventDefault();
  const text=$('chatInput').value.trim();
  if(!text||!matchId) return;
  const isPlayer=state&&([...(state.teamA||[]),...(state.teamB||[])].some(f=>f.id===asUser));
  try{
    const res=await fetch('/api/arena/'+matchId+'/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId:asUser,name:isPlayer?(state.teamA?.find(f=>f.id===asUser)||state.teamB?.find(f=>f.id===asUser)||{}).name||'Jogador':'Visitante',text,spectator:!isPlayer})
    });
    const data=await res.json();
    if(data.ok){renderChat(data.chat);$('chatInput').value='';}
  }catch(_){}
};
$('emojiBar').onclick=async(ev)=>{
  const btn=ev.target.closest('button[data-e]');
  if(!btn||!matchId) return;
  const emoji=btn.getAttribute('data-e');
  spawnFloatEmoji(emoji);
  try{
    await fetch('/api/arena/'+matchId+'/react',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId:asUser,emoji})
    });
  }catch(_){}
};
if(matchId&&asUser){$('matchIdInput').value=matchId;$('asInput').value=asUser;enter();}
</script>
</body>
</html>
