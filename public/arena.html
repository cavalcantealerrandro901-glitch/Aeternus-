<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>✦ Arena PvP — Aeternus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:wght@400;600&display=swap');
:root{
  --bg:#070605; --panel:#14100c; --gold:#c9a227; --gold-dim:#7a5c12;
  --hp:#22c55e; --mana:#3b82f6; --ink:#f5e6c8; --muted:#a89f91; --card:#1a1510;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;color:var(--ink);font-family:'Crimson Text',Georgia,serif;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,#2a1810 0%,transparent 55%),var(--bg);
  display:flex;flex-direction:column;
}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.header{
  text-align:center;padding:.75rem 1rem .4rem;border-bottom:1px solid #c9a22733;
  background:linear-gradient(180deg,#1a120c 0%,transparent 100%);
}
.header h1{
  font-family:Cinzel,serif;font-size:1.15rem;letter-spacing:.18em;
  color:var(--gold);text-shadow:0 0 18px #c9a22755;
}
.turn-line{margin-top:.35rem;font-size:.95rem;color:var(--muted)}
.turn-line strong{color:var(--gold);font-family:Cinzel,serif}
.timer{display:inline-block;min-width:3.2rem;font-variant-numeric:tabular-nums;color:#fde68a;font-weight:600}
.field{
  flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center;
  padding:1rem .75rem .5rem;max-width:1100px;margin:0 auto;width:100%;
}
.fighter{
  background:linear-gradient(160deg,#1c1510 0%,#0e0b09 100%);
  border:1px solid var(--gold-dim);border-radius:12px;padding:.85rem 1rem;
  box-shadow:0 8px 28px #000a;min-width:0;
}
.fighter.you{border-color:#c9a22788}
.fighter.enemy{border-color:#7f1d1d88}
.fighter .name{font-family:Cinzel,serif;font-size:1.05rem;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fighter .meta{font-size:.82rem;color:var(--muted);margin:.15rem 0 .5rem}
.bar-row{margin:.28rem 0}
.bar-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:.12rem}
.bar{height:10px;border-radius:6px;background:#0a0806;overflow:hidden;border:1px solid #ffffff12}
.bar>i{display:block;height:100%;width:100%;transform-origin:left center;transition:transform .35s ease}
.bar.hp>i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bar.mana>i{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.stats-mini{display:flex;gap:.75rem;margin-top:.45rem;font-size:.8rem;color:var(--muted)}
.stats-mini span strong{color:var(--ink)}
.vs-col{text-align:center;padding:0 .35rem}
.vs-col .vs{font-family:Cinzel,serif;font-size:1.4rem;color:var(--gold);text-shadow:0 0 20px #c9a22766}
.vs-col .fx{min-height:1.6rem;margin-top:.4rem;font-size:.9rem;color:#fca5a5}
.bottom{
  display:grid;grid-template-columns:1.1fr 1fr;gap:.75rem;
  max-width:1100px;width:100%;margin:0 auto;padding:.5rem .75rem 0;
}
@media(max-width:720px){
  .field{grid-template-columns:1fr;gap:.5rem}
  .vs-col{order:-1}
  .bottom{grid-template-columns:1fr}
}
.panel{
  background:var(--panel);border:1px solid #c9a22728;border-radius:12px;
  padding:.65rem .75rem;min-height:160px;max-height:240px;display:flex;flex-direction:column;
}
.panel h3{font-family:Cinzel,serif;font-size:.78rem;letter-spacing:.12em;color:var(--gold);margin-bottom:.45rem}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.45rem;overflow-y:auto;flex:1}
.skill{
  background:var(--card);border:1px solid #c9a22733;border-radius:8px;padding:.45rem .5rem;
  text-align:left;color:var(--ink);
}
.skill:hover:not(:disabled){border-color:var(--gold)}
.skill:disabled{opacity:.4;cursor:not-allowed}
.skill .sn{font-family:Cinzel,serif;font-size:.78rem;color:var(--gold)}
.skill .sd{font-size:.72rem;color:var(--muted);margin:.15rem 0;line-height:1.25;min-height:2.1em}
.skill .sm{font-size:.72rem;color:#93c5fd}
.skill .scd{font-size:.7rem;color:#fbbf24}
.log{overflow-y:auto;flex:1;font-size:.82rem;line-height:1.4}
.log .line{padding:.2rem 0;border-bottom:1px solid #ffffff08;color:var(--muted)}
.log .line:last-child{color:var(--ink)}
.chat-wrap{max-width:1100px;width:100%;margin:0 auto;padding:.55rem .75rem 0}
.chat{background:var(--panel);border:1px solid #c9a22728;border-radius:12px;padding:.55rem .7rem}
.chat h3{font-family:Cinzel,serif;font-size:.75rem;letter-spacing:.1em;color:var(--gold);margin-bottom:.35rem}
.chat-body{max-height:100px;overflow-y:auto;font-size:.85rem;margin-bottom:.4rem}
.chat-msg{margin:.15rem 0;color:var(--muted)}
.chat-msg .who{color:var(--gold);font-weight:600}
.chat-row{display:flex;gap:.4rem}
.chat-row input{
  flex:1;background:#0a0806;border:1px solid #c9a22733;border-radius:8px;color:var(--ink);padding:.45rem .6rem;font:inherit;
}
.chat-row button{
  background:linear-gradient(180deg,#3a2a12,#1a1208);border:1px solid var(--gold-dim);
  color:var(--gold);border-radius:8px;padding:.45rem .85rem;font-family:Cinzel,serif;font-size:.75rem;
}
.footer-actions{
  max-width:1100px;width:100%;margin:0 auto;padding:.65rem .75rem 1rem;
  display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;
}
.footer-actions button{
  border-radius:10px;padding:.55rem 1rem;font-family:Cinzel,serif;font-size:.78rem;
  letter-spacing:.06em;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,#2a1e10,#120e08);color:var(--gold);
}
.footer-actions button.danger{border-color:#7f1d1d;color:#fca5a5;background:linear-gradient(180deg,#2a1210,#120808)}
.footer-actions button:disabled{opacity:.45;cursor:not-allowed}
.lobby{
  max-width:420px;margin:3rem auto;padding:1.25rem;background:var(--panel);
  border:1px solid var(--gold-dim);border-radius:14px;
}
.lobby h2{font-family:Cinzel,serif;color:var(--gold);text-align:center;margin-bottom:1rem}
.lobby label{display:block;font-size:.85rem;color:var(--muted);margin:.5rem 0 .2rem}
.lobby input{
  width:100%;padding:.5rem .65rem;border-radius:8px;border:1px solid #c9a22733;background:#0a0806;color:var(--ink);font:inherit;
}
.lobby button{
  width:100%;margin-top:1rem;padding:.65rem;border-radius:10px;font-family:Cinzel,serif;
  border:1px solid var(--gold);background:#1a140c;color:var(--gold);
}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:100}
.overlay .box{
  background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:1.25rem 1.5rem;max-width:360px;text-align:center;
}
.overlay .box h2{font-family:Cinzel,serif;color:var(--gold);margin-bottom:.5rem}
.overlay .box p{color:var(--muted);margin-bottom:1rem}
.overlay .box button{
  margin:.25rem;padding:.5rem 1rem;border-radius:8px;border:1px solid var(--gold-dim);background:#1a140c;color:var(--gold);font-family:Cinzel,serif;
}
</style>
</head>
<body>
<div id="lobby" class="lobby">
  <h2>✦ Arena PvP ✦</h2>
  <label>ID da batalha</label>
  <input id="matchIdInput" placeholder="match id" />
  <label>Seu Discord User ID</label>
  <input id="asInput" placeholder="seu user id" />
  <button type="button" id="joinBtn">Entrar na batalha</button>
</div>
<div id="battle" class="hidden">
  <header class="header">
    <h1>✦ ARENA PVP ✦</h1>
    <div class="turn-line">
      <span id="turnText">Aguardando…</span>
      · ⏱️ <span class="timer" id="timer">—</span>
    </div>
  </header>
  <section class="field">
    <div class="fighter you" id="cardA">
      <div class="name" id="nameA">—</div>
      <div class="meta" id="metaA">—</div>
      <div class="bar-row">
        <div class="bar-label"><span>❤️ HP</span><span id="hpTextA">0 / 0</span></div>
        <div class="bar hp"><i id="hpBarA" style="transform:scaleX(1)"></i></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>🔵 Mana</span><span id="manaTextA">0 / 0</span></div>
        <div class="bar mana"><i id="manaBarA" style="transform:scaleX(1)"></i></div>
      </div>
      <div class="stats-mini" id="statsA"></div>
    </div>
    <div class="vs-col">
      <div class="vs">VS</div>
      <div class="fx" id="fxText"></div>
    </div>
    <div class="fighter enemy" id="cardB">
      <div class="name" id="nameB">—</div>
      <div class="meta" id="metaB">—</div>
      <div class="bar-row">
        <div class="bar-label"><span>❤️ HP</span><span id="hpTextB">0 / 0</span></div>
        <div class="bar hp"><i id="hpBarB" style="transform:scaleX(1)"></i></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>🔵 Mana</span><span id="manaTextB">0 / 0</span></div>
        <div class="bar mana"><i id="manaBarB" style="transform:scaleX(1)"></i></div>
      </div>
      <div class="stats-mini" id="statsB"></div>
    </div>
  </section>
  <section class="bottom">
    <div class="panel">
      <h3>⚔️ HABILIDADES</h3>
      <div class="skills" id="skills"></div>
    </div>
    <div class="panel">
      <h3>📜 LOG DA BATALHA</h3>
      <div class="log" id="log"></div>
    </div>
  </section>
  <section class="chat-wrap">
    <div class="chat">
      <h3>💬 CHAT DA BATALHA</h3>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-row">
        <input id="chatInput" maxlength="300" placeholder="Digite sua mensagem…" autocomplete="off" />
        <button type="button" id="chatSendBtn">ENVIAR</button>
      </div>
    </div>
  </section>
  <div class="footer-actions">
    <button type="button" id="skipBtn" disabled>⌛ AGUARDAR TURNO</button>
    <button type="button" id="forfeitBtn" class="danger">🚪 DESISTIR DA BATALHA</button>
  </div>
</div>
<div id="confirmForfeit" class="overlay hidden">
  <div class="box">
    <h2>Desistir?</h2>
    <p>Deseja realmente desistir da batalha? Isso conta como derrota.</p>
    <button type="button" id="ffYes">Sim, desistir</button>
    <button type="button" id="ffNo">Cancelar</button>
  </div>
</div>
<div id="endOverlay" class="overlay hidden">
  <div class="box">
    <h2 id="endTitle">Fim</h2>
    <p id="endBody"></p>
    <button type="button" onclick="document.getElementById('endOverlay').classList.add('hidden')">Fechar</button>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let matchId = params.get('id') || '';
  let asUser = params.get('as') || '';
  let state = null;
  let pollTimer = null;
  let tickTimer = null;
  let acting = false;

  function scale(el, cur, max) {
    if (!el) return;
    const p = max > 0 ? Math.max(0, Math.min(1, cur / max)) : 0;
    el.style.transform = 'scaleX(' + p + ')';
  }
  function fmtTimer(msLeft) {
    const s = Math.max(0, Math.ceil(msLeft / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return (m > 0 ? m + ':' : '0:') + String(r).padStart(2, '0');
  }
  function pickSides(s) {
    const a = (s.teamA || [])[0];
    const b = (s.teamB || [])[0];
    if (!a || !b) return { left: a || b, right: b || a };
    if (String(a.id) === String(asUser)) return { left: a, right: b };
    if (String(b.id) === String(asUser)) return { left: b, right: a };
    return { left: a, right: b };
  }
  function fillFighter(side, f) {
    if (!f) return;
    $('name' + side).textContent = f.name || '—';
    $('meta' + side).textContent =
      (f.emoji || '') + ' ' + (f.className || f.classId || 'Classe') + ' · Nv. ' + (f.level || 0);
    $('hpText' + side).textContent = (f.hp || 0) + ' / ' + (f.maxHp || 0);
    $('manaText' + side).textContent = (f.mana || 0) + ' / ' + (f.maxMana || 0);
    scale($('hpBar' + side), f.hp || 0, f.maxHp || 1);
    scale($('manaBar' + side), f.mana || 0, f.maxMana || 1);
    const at = f.attrs || {};
    $('stats' + side).innerHTML =
      '<span>⚔️ Atq <strong>' + (at.forca || 0) + '</strong></span>' +
      '<span>🛡️ Def <strong>' + (at.defesa || 0) + '</strong></span>' +
      '<span>💨 Agi <strong>' + (at.agilidade || 0) + '</strong></span>';
  }
  function renderSkills(s) {
    const box = $('skills');
    box.innerHTML = '';
    const me =
      (s.teamA || []).find((x) => String(x.id) === String(asUser)) ||
      (s.teamB || []).find((x) => String(x.id) === String(asUser));
    if (!me) {
      box.innerHTML = '<div class="sd">Você não está nesta batalha.</div>';
      return;
    }
    const myTurn = s.yourTurn && s.status === 'active';
    const skills = [];
    if (me.basicAttack) {
      skills.push({
        id: me.basicAttack.id || 'basic',
        name: me.basicAttack.name || 'Ataque',
        emoji: me.basicAttack.emoji || '⚔️',
        mana: 0,
        currentCd: 0,
        desc: 'Ataque básico da classe'
      });
    }
    (me.actives || []).forEach((a) => skills.push(a));
    skills.forEach((sk) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'skill';
      const cd = sk.currentCd || 0;
      const needMana = sk.mana || 0;
      const can = myTurn && !acting && cd <= 0 && (me.mana || 0) >= needMana && (me.hp || 0) > 0;
      btn.disabled = !can;
      btn.innerHTML =
        '<div class="sn">' + (sk.emoji || '✨') + ' ' + (sk.name || sk.id) + '</div>' +
        '<div class="sd">' + (sk.desc || 'Habilidade') + '</div>' +
        '<div class="sm">MP ' + needMana + '</div>' +
        (cd > 0 ? '<div class="scd">CD ' + cd + '</div>' : '');
      btn.onclick = () => doMove(sk.id === me.basicAttack?.id ? 'basic' : sk.id);
      box.appendChild(btn);
    });
  }
  function renderLog(s) {
    const box = $('log');
    box.innerHTML = (s.log || []).slice(-40).map((l) => '<div class="line">' + (l.text || '') + '</div>').join('');
    box.scrollTop = box.scrollHeight;
  }
  function renderChat(list) {
    const box = $('chatBody');
    box.innerHTML = (list || [])
      .map((m) => {
        const mine = String(m.from) === String(asUser);
        return (
          '<div class="chat-msg"><span class="who">' +
          (mine ? 'Você' : m.name || 'Jogador') +
          ':</span> ' +
          (m.text || '') +
          '</div>'
        );
      })
      .join('');
    box.scrollTop = box.scrollHeight;
  }
  function render(s) {
    state = s;
    if (!s) return;
    const { left, right } = pickSides(s);
    fillFighter('A', left);
    fillFighter('B', right);
    const cur = (s.teamA || []).concat(s.teamB || []).find((x) => String(x.id) === String(s.currentId));
    if (s.status === 'finished') {
      $('turnText').innerHTML = '🏆 Batalha encerrada';
      $('timer').textContent = '—';
    } else if (cur) {
      const mine = String(s.currentId) === String(asUser);
      $('turnText').innerHTML =
        'Turno de <strong>' + (mine ? 'você' : cur.name || 'Jogador') + '</strong>';
    }
    if (s.lastEffect) {
      const fx = s.lastEffect;
      if (fx.type === 'hit')
        $('fxText').textContent = (fx.crit ? '💥 CRÍTICO ' : '⚔️ ') + (fx.dmg || '') + ' dano';
      else if (fx.type === 'heal') $('fxText').textContent = '💚 +' + (fx.amount || 0);
      else if (fx.type === 'dodge') $('fxText').textContent = '🌀 Esquiva!';
      else $('fxText').textContent = '';
    }
    renderSkills(s);
    renderLog(s);
    renderChat(s.chat);
    const myTurn = s.yourTurn && s.status === 'active';
    $('skipBtn').disabled = !myTurn || acting;
    $('forfeitBtn').disabled = s.status !== 'active';
    if (s.status === 'finished' && !$('endOverlay').dataset.shown) {
      $('endOverlay').dataset.shown = '1';
      $('endOverlay').classList.remove('hidden');
      const won = s.youWon === true;
      $('endTitle').textContent = won ? 'Vitória!' : s.youWon === false ? 'Derrota' : 'Fim da batalha';
      $('endBody').textContent = won
        ? 'Seu time venceu. Recompensas aplicadas no servidor.'
        : 'A batalha terminou.';
    }
  }
  async function poll() {
    if (!matchId) return;
    try {
      const r = await fetch('/api/arena/' + encodeURIComponent(matchId) + '?as=' + encodeURIComponent(asUser));
      if (!r.ok) return;
      render(await r.json());
    } catch (_) {}
  }
  function tick() {
    if (!state?.turnEndsAt || state.status !== 'active') {
      $('timer').textContent = '—';
      return;
    }
    $('timer').textContent = fmtTimer(state.turnEndsAt - Date.now());
  }
  async function doMove(moveId) {
    if (acting || !state?.yourTurn) return;
    acting = true;
    try {
      const r = await fetch('/api/arena/' + encodeURIComponent(matchId) + '/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: asUser, moveId })
      });
      const data = await r.json();
      if (data.match) render(data.match);
      else if (data.error) alert(data.error);
      else await poll();
    } catch (e) {
      alert('Erro ao agir');
    } finally {
      acting = false;
    }
  }
  async function doSkip() {
    if (acting) return;
    acting = true;
    try {
      const r = await fetch('/api/arena/' + encodeURIComponent(matchId) + '/skip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: asUser })
      });
      const data = await r.json();
      if (data.match) render(data.match);
      else if (data.error) alert(data.error);
    } finally {
      acting = false;
    }
  }
  async function doForfeit() {
    try {
      const r = await fetch('/api/arena/' + encodeURIComponent(matchId) + '/forfeit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: asUser })
      });
      const data = await r.json();
      if (data.match) render(data.match);
      else if (data.error) alert(data.error);
    } finally {
      $('confirmForfeit').classList.add('hidden');
    }
  }
  async function sendChat() {
    const text = $('chatInput').value.trim();
    if (!text) return;
    $('chatInput').value = '';
    const r = await fetch('/api/arena/' + encodeURIComponent(matchId) + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerId: asUser, text })
    });
    const data = await r.json();
    if (data.chat) renderChat(data.chat);
    else if (data.error) alert(data.error);
  }
  function enter() {
    matchId = $('matchIdInput').value.trim() || matchId;
    asUser = $('asInput').value.trim() || asUser;
    if (!matchId || !asUser) {
      alert('Informe o ID da batalha e seu User ID');
      return;
    }
    $('lobby').classList.add('hidden');
    $('battle').classList.remove('hidden');
    poll();
    clearInterval(pollTimer);
    clearInterval(tickTimer);
    pollTimer = setInterval(poll, 2000);
    tickTimer = setInterval(tick, 250);
  }
  $('joinBtn').onclick = enter;
  $('skipBtn').onclick = doSkip;
  $('forfeitBtn').onclick = () => $('confirmForfeit').classList.remove('hidden');
  $('ffYes').onclick = doForfeit;
  $('ffNo').onclick = () => $('confirmForfeit').classList.add('hidden');
  $('chatSendBtn').onclick = sendChat;
  $('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChat();
  });
  if (matchId && asUser) {
    $('matchIdInput').value = matchId;
    $('asInput').value = asUser;
    enter();
  }
})();
</script>
</body>
</html>
