<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Aeternus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:wght@400;600&display=swap');
  :root { --bg:#0c0a09; --panel:#1c1410; --gold:#c9a227; --gold-dim:#8b6914; --mana:#2563eb; --hp:#16a34a; --ink:#f5e6c8; --muted:#a89f91; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(ellipse at 50% 0%,#2a1a0a 0%,transparent 55%),var(--bg); color:var(--ink); font-family:'Crimson Text',Georgia,serif; }
  header { text-align:center; padding:1rem 1rem .5rem; border-bottom:1px solid var(--gold-dim); }
  header h1 { font-family:Cinzel,serif; font-size:1.6rem; color:var(--gold); letter-spacing:.12em; text-shadow:0 0 20px #c9a22755; }
  header p { color:var(--muted); font-size:.95rem; margin-top:.25rem; }
  .layout { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:.75rem; max-width:1200px; margin:.75rem auto; padding:0 .75rem 2rem; }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }
  .side { background:linear-gradient(160deg,#22180f 0%,#120e0a 100%); border:1px solid var(--gold-dim); border-radius:12px; padding:.85rem; }
  .side.enemy { border-color:#7f1d1d; }
  .attrs { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.6rem; font-size:.8rem; color:var(--muted); }
  .attrs span { background:#0006; border:1px solid #c9a22733; padding:.15rem .4rem; border-radius:6px; }
  .fighter-head { display:flex; gap:.75rem; align-items:center; margin-bottom:.6rem; }
  .avatar { width:88px; height:88px; border-radius:50%; border:2px solid var(--gold); object-fit:cover; background:#000; box-shadow:0 0 18px #c9a22744; }
  .avatar.hit { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .meta h2 { font-family:Cinzel,serif; font-size:1.1rem; color:var(--gold); }
  .meta .sub { color:var(--muted); font-size:.85rem; }
  .bar-wrap { margin:.35rem 0; }
  .bar-label { display:flex; justify-content:space-between; font-size:.78rem; margin-bottom:.15rem; color:var(--muted); }
  .bar { height:14px; border-radius:8px; background:#000a; border:1px solid #ffffff15; overflow:hidden; }
  .bar > i { display:block; height:100%; width:100%; transform-origin:left center; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  .bar.hp > i { background:linear-gradient(90deg,#14532d,var(--hp)); }
  .bar.mana > i { background:linear-gradient(90deg,#1e3a8a,var(--mana)); }
  .passives { margin-top:.6rem; display:flex; flex-wrap:wrap; gap:.3rem; }
  .passives .chip { font-size:.75rem; padding:.2rem .45rem; border-radius:999px; background:#3b0764; border:1px solid #7c3aed55; color:#e9d5ff; }
  .center { background:linear-gradient(180deg,#1a120c 0%,#0f0b08 100%); border:1px solid var(--gold-dim); border-radius:12px; padding:.85rem; display:flex; flex-direction:column; min-height:420px; }
  .center h3 { font-family:Cinzel,serif; color:var(--gold); font-size:.95rem; margin-bottom:.5rem; text-align:center; }
  .log { flex:1; overflow-y:auto; max-height:280px; font-size:.92rem; line-height:1.45; padding:.4rem; background:#0005; border-radius:8px; border:1px solid #c9a22722; }
  .log .line { padding:.25rem 0; border-bottom:1px solid #ffffff08; }
  .turn-info { text-align:center; margin:.55rem 0; font-family:Cinzel,serif; font-size:.9rem; color:var(--gold); }
  .timer { display:inline-block; min-width:3rem; color:#fbbf24; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin-top:.5rem; }
  .actions button { font-family:Cinzel,serif; font-size:.78rem; padding:.55rem .4rem; border-radius:8px; border:1px solid var(--gold-dim); background:linear-gradient(180deg,#3a2a12 0%,#1a1208 100%); color:var(--ink); cursor:pointer; }
  .actions button:hover:not(:disabled) { border-color:var(--gold); box-shadow:0 0 12px #c9a22744; }
  .actions button:disabled { opacity:.4; cursor:not-allowed; }
  .actions button.basic { grid-column:1 / -1; background:linear-gradient(180deg,#4a1c1c 0%,#1a0a0a 100%); border-color:#9b1c1c; }
  .lobby { max-width:560px; margin:2rem auto; padding:1.5rem; background:var(--panel); border:1px solid var(--gold-dim); border-radius:12px; text-align:center; }
  .lobby input,.lobby button { font-family:inherit; padding:.5rem .75rem; margin:.3rem; border-radius:8px; border:1px solid var(--gold-dim); background:#0c0a09; color:var(--ink); }
  .lobby button { background:linear-gradient(180deg,#3a2a12,#1a1208); cursor:pointer; font-family:Cinzel,serif; }
  .status-banner { text-align:center; padding:.6rem; font-family:Cinzel,serif; color:var(--gold); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><h1>⚔ Arena Aeternus ⚔</h1><p>Medieval · Magia · Turnos longos</p></header>
<div id="lobby" class="lobby">
  <p style="margin-bottom:1rem;color:var(--muted)">Entre com o ID da batalha ou use <code>O.masmorra</code> / <code>O.arena @user</code>.</p>
  <input id="matchIdInput" placeholder="ID da arena / masmorra" style="width:70%" />
  <input id="asInput" placeholder="Seu Discord User ID" style="width:70%" /><br/>
  <button id="joinBtn">Entrar na Arena</button>
</div>
<div id="battle" class="layout hidden">
  <section class="side" id="sideA">
    <div class="attrs" id="attrsA"></div>
    <div class="fighter-head"><img class="avatar" id="avatarA" alt="avatar" src="" /><div class="meta"><h2 id="nameA">—</h2><div class="sub" id="classA">—</div></div></div>
    <div class="bar-wrap"><div class="bar-label"><span>Vida</span><span id="hpTextA">0/0</span></div><div class="bar hp"><i id="hpBarA"></i></div></div>
    <div class="bar-wrap"><div class="bar-label"><span>Mana</span><span id="manaTextA">0/0</span></div><div class="bar mana"><i id="manaBarA"></i></div></div>
    <div class="passives" id="passA"></div>
  </section>
  <section class="center">
    <h3>📜 Crônica da Batalha</h3>
    <div class="log" id="log"></div>
    <div class="turn-info">Turno: <span id="turnName">—</span> · <span class="timer" id="timer">--</span>s</div>
    <div class="status-banner" id="statusBanner"></div>
    <div class="actions" id="actions"></div>
  </section>
  <section class="side enemy" id="sideB">
    <div class="attrs" id="attrsB"></div>
    <div class="fighter-head"><img class="avatar" id="avatarB" alt="avatar" src="" /><div class="meta"><h2 id="nameB">—</h2><div class="sub" id="classB">—</div></div></div>
    <div class="bar-wrap"><div class="bar-label"><span>Vida</span><span id="hpTextB">0/0</span></div><div class="bar hp"><i id="hpBarB"></i></div></div>
    <div class="bar-wrap"><div class="bar-label"><span>Mana</span><span id="manaTextB">0/0</span></div><div class="bar mana"><i id="manaBarB"></i></div></div>
    <div class="passives" id="passB"></div>
  </section>
</div>
<script>
const qs = new URLSearchParams(location.search);
let matchId = qs.get('id') || qs.get('dungeon') || '';
let asUser = qs.get('as') || '';
let isDungeon = !!qs.get('dungeon');
let state = null, pollTimer = null, tickTimer = null;
const $ = id => document.getElementById(id);
function barScale(el, cur, max) {
  const pct = Math.max(0, Math.min(1, (cur||0)/Math.max(1,max||1)));
  el.style.transform = 'scaleX('+pct+')';
}
function setFighter(side, f) {
  if (!f) return;
  $('name'+side).textContent = (f.emoji||'')+' '+f.name;
  $('class'+side).textContent = (f.className||'')+' · Nv.'+(f.level||0);
  $('avatar'+side).src = (f.battleAvatar&&f.battleAvatar.imageUrl)||f.photo||'https://placehold.co/128x128/1c1410/c9a227/png?text=?';
  $('hpText'+side).textContent = f.hp+'/'+f.maxHp;
  $('manaText'+side).textContent = f.mana+'/'+f.maxMana;
  barScale($('hpBar'+side), f.hp, f.maxHp);
  barScale($('manaBar'+side), f.mana, f.maxMana);
  const attrs = f.attrs||{};
  $('attrs'+side).innerHTML = ['forca','defesa','agilidade','vida'].map(k=>'<span>'+k.slice(0,3).toUpperCase()+' '+(attrs[k]??0)+'</span>').join('');
  const pass = f.passives||[];
  $('pass'+side).innerHTML = pass.filter(Boolean).map(p=>'<span class="chip" title="'+(p.desc||'')+'">'+(p.emoji||'')+' '+p.name+'</span>').join('')||'<span class="chip">Sem passivas</span>';
}
function renderLog(log) {
  const box = $('log');
  box.innerHTML = (log||[]).map(l=>'<div class="line">'+l.text+'</div>').join('');
  box.scrollTop = box.scrollHeight;
}
function renderActions() {
  const box = $('actions'); box.innerHTML = '';
  if (!state||state.status!=='active') return;
  if (!state.yourTurn) { box.innerHTML = '<button disabled>Aguardando oponente...</button>'; return; }
  const me = isDungeon ? state.player : (state.teamA?.find(f=>f.id===asUser)||state.teamB?.find(f=>f.id===asUser));
  if (!me) return;
  const basic = me.basicAttack||{id:'basic',name:'Ataque',emoji:'⚔️'};
  const b = document.createElement('button'); b.className='basic';
  b.textContent = (basic.emoji||'⚔️')+' '+(basic.name||'Ataque básico');
  b.onclick = ()=>doMove(basic.id==='basic'?'basic':basic.id); box.appendChild(b);
  (me.actives||[]).forEach(a=>{
    const btn=document.createElement('button');
    const cd=a.currentCd||0;
    btn.disabled = cd>0||(me.mana<(a.mana||0));
    btn.textContent = (a.emoji||'')+' '+a.name+' · 💧'+(a.mana||0)+(cd?' · CD'+cd:'');
    btn.title=a.desc||''; btn.onclick=()=>doMove(a.id); box.appendChild(btn);
  });
}
async function doMove(moveId) {
  if (!matchId||!asUser) return;
  const url = isDungeon ? '/api/dungeon/'+matchId+'/move' : '/api/arena/'+matchId+'/move';
  try {
    const res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:asUser,moveId})});
    const data = await res.json();
    if (!data.ok) { alert(data.error||'Erro'); return; }
    applyState(data.match);
  } catch(e) { alert('Falha de rede'); }
}
function applyState(s) {
  state = s;
  if (isDungeon) { setFighter('A',s.player); setFighter('B',s.monster); }
  else { setFighter('A',s.teamA?.[0]); setFighter('B',s.teamB?.[0]); }
  renderLog(s.log); renderActions();
  const curName = isDungeon ? (s.currentId===s.player?.id?s.player?.name:s.monster?.name) : ([...(s.teamA||[]),...(s.teamB||[])].find(f=>f.id===s.currentId)?.name||'—');
  $('turnName').textContent = curName||'—';
  $('statusBanner').textContent = s.status==='finished' ? (s.winnerTeam==='A'?'🏆 Vitória!':'💀 Derrota...') : (s.yourTurn?'Sua vez — escolha uma ação':'Turno do oponente');
  if (s.lastEffect?.type==='hit') {
    const el = $('avatar'+(isDungeon&&s.lastEffect.to===s.monster?.id?'B':'A'));
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  }
}
async function poll() {
  if (!matchId) return;
  const url = isDungeon ? '/api/dungeon/'+matchId+'?as='+encodeURIComponent(asUser) : '/api/arena/'+matchId+'?as='+encodeURIComponent(asUser);
  try { const res=await fetch(url); if(res.ok) applyState(await res.json()); } catch(_){}
}
function tick(){ if(!state?.turnEndsAt)return; $('timer').textContent=Math.max(0,Math.ceil((state.turnEndsAt-Date.now())/1000)); }
function enter(){
  matchId=$('matchIdInput').value.trim()||matchId; asUser=$('asInput').value.trim()||asUser;
  if(!matchId||!asUser){alert('Informe o ID da batalha e seu User ID');return;}
  isDungeon=matchId.startsWith('dg_')||isDungeon;
  $('lobby').classList.add('hidden'); $('battle').classList.remove('hidden');
  poll(); clearInterval(pollTimer); clearInterval(tickTimer);
  pollTimer=setInterval(poll,2500); tickTimer=setInterval(tick,500);
}
$('joinBtn').onclick=enter;
if(matchId&&asUser){$('matchIdInput').value=matchId;$('asInput').value=asUser;enter();}
</script>
</body>
</html>
