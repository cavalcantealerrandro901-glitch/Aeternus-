<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeternus · Efeitos</title>
  <style>
    :root {
      --text: #f1f5f9; --muted: #94a3b8;
      --card: rgba(18,24,38,.92); --glow: 0 0 40px rgba(240,171,252,.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui,sans-serif; color: var(--text); background: #070a12; min-height: 100vh; }
    .bg { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(800px 400px at 20% 0%, rgba(192,132,252,.35), transparent 55%),
                  radial-gradient(600px 400px at 90% 20%, rgba(244,114,182,.2), transparent 50%), #070a12; }
    .nav-menu { position: fixed; top: 16px; right: 16px; z-index: 40; }
    .nav-toggle {
      width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(240,171,252,.45);
      background: rgba(15,23,42,.9); color: #fff; font-size: 1.25rem; cursor: pointer; box-shadow: var(--glow);
    }
    .nav-panel {
      display: none; position: absolute; top: 54px; right: 0; min-width: 210px;
      background: rgba(15,23,42,.96); border: 1px solid rgba(240,171,252,.35); border-radius: 14px; overflow: hidden;
    }
    .nav-panel.open { display: block; }
    .nav-panel a {
      display: block; padding: 12px 16px; color: var(--text); text-decoration: none; font-weight: 600;
      border-bottom: 1px solid rgba(51,65,85,.6);
    }
    .nav-panel a:hover { background: rgba(192,132,252,.2); }
    .nav-panel a.active { color: #f0abfc; }
    header { position: relative; z-index: 1; padding: 56px 20px 10px; text-align: center; }
    h1 {
      margin: 0; font-size: clamp(1.5rem,4vw,2.1rem); letter-spacing: .08em; text-transform: uppercase;
      background: linear-gradient(90deg,#f0abfc,#c4b5fd,#fde68a); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { color: var(--muted); max-width: 520px; margin: 10px auto 0; }
    .bal {
      display: inline-flex; gap: 16px; margin-top: 14px; padding: 12px 20px; border-radius: 999px;
      background: rgba(15,23,42,.8); border: 1px solid rgba(240,171,252,.35);
    }
    .msg { text-align: center; color: var(--muted); padding: 12px; position: relative; z-index: 1; }
    .grid {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
      gap: 20px; padding: 12px 20px 48px; max-width: 1100px; margin: 0 auto;
    }
    .card {
      background: var(--card); border: 1px solid rgba(51,65,85,.9); border-radius: 18px;
      overflow: hidden; cursor: pointer; transition: .2s;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(240,171,252,.6); box-shadow: var(--glow); }
    .preview-stage {
      position: relative; height: 180px;
      background: linear-gradient(160deg, #1e1b4b, #0f172a);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .preview-stage .bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 8px;
    }
    .avatar-wrap {
      position: relative; width: 96px; height: 96px;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-core {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: 3px solid #fff; z-index: 2; position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .avatar-core::after {
      content: "A"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.6rem; color: #fff;
    }
    .card .body { padding: 14px 16px 16px; }
    .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .desc { color: var(--muted); font-size: .88rem; margin: 0 0 8px; min-height: 2.4em; }
    .price { font-weight: 800; color: #f0abfc; }
    .badge {
      display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px;
      font-size: .7rem; font-weight: 700; background: rgba(16,185,129,.2); color: #6ee7b7;
    }
    .live-tag {
      position: absolute; top: 10px; left: 10px; z-index: 3;
      font-size: .65rem; font-weight: 800; letter-spacing: .06em;
      padding: 3px 8px; border-radius: 999px;
      background: rgba(239,68,68,.85); color: #fff;
      animation: pulseLive 1.4s ease infinite;
    }
    @keyframes pulseLive {
      0%,100% { opacity: 1; }
      50% { opacity: .55; }
    }

    /* —— EFEITOS AO VIVO —— */
    /* FIRE */
    .fx-fire .aura {
      position: absolute; inset: -18px; border-radius: 50%;
      background: radial-gradient(circle, rgba(251,191,36,.85) 0%, rgba(249,115,22,.55) 40%, transparent 70%);
      animation: firePulse 1.1s ease-in-out infinite alternate;
      z-index: 0;
    }
    .fx-fire .flame {
      position: absolute; bottom: 70%; left: 50%; width: 18px; height: 36px;
      margin-left: -9px; border-radius: 50% 50% 40% 40%;
      background: linear-gradient(to top, #dc2626, #f97316, #fbbf24);
      animation: flameUp 0.7s ease-in-out infinite alternate;
      z-index: 1; filter: blur(0.5px);
    }
    .fx-fire .flame:nth-child(2) { left: 35%; animation-delay: .15s; height: 28px; }
    .fx-fire .flame:nth-child(3) { left: 65%; animation-delay: .25s; height: 32px; }
    .fx-fire .flame:nth-child(4) { left: 45%; animation-delay: .1s; height: 40px; width: 14px; }
    .fx-fire .bar { background: linear-gradient(90deg, #7f1d1d, #f97316, #7f1d1d); background-size: 200% 100%; animation: barMove 2s linear infinite; }
    @keyframes firePulse { from { transform: scale(0.92); opacity: .8; } to { transform: scale(1.08); opacity: 1; } }
    @keyframes flameUp { from { transform: translateY(4px) scaleY(0.9); opacity: .85; } to { transform: translateY(-6px) scaleY(1.1); opacity: 1; } }

    /* GLOW */
    .fx-glow .aura {
      position: absolute; inset: -22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(245,243,255,.9), rgba(196,181,253,.5) 45%, transparent 70%);
      animation: glowSpin 3s linear infinite; z-index: 0;
    }
    .fx-glow .ring {
      position: absolute; inset: -8px; border-radius: 50%; border: 3px solid rgba(196,181,253,.8);
      animation: ringPulse 1.5s ease infinite; z-index: 1;
    }
    .fx-glow .bar { background: linear-gradient(90deg, #4c1d95, #c4b5fd, #4c1d95); background-size: 200% 100%; animation: barMove 2.5s linear infinite; }
    @keyframes glowSpin { to { transform: rotate(360deg); } }
    @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }

    /* NEON */
    .fx-neon .aura {
      position: absolute; inset: -16px; border-radius: 50%;
      box-shadow: 0 0 20px #f0abfc, 0 0 40px #22d3ee, inset 0 0 20px rgba(240,171,252,.3);
      border: 3px solid #f0abfc; animation: neonFlicker 1.2s ease-in-out infinite; z-index: 0;
    }
    .fx-neon .ring {
      position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #22d3ee;
      box-shadow: 0 0 12px #22d3ee; z-index: 1;
    }
    .fx-neon .bar { background: linear-gradient(90deg, #db2777, #22d3ee, #a855f7); background-size: 200% 100%; animation: barMove 1.8s linear infinite; }
    @keyframes neonFlicker { 0%,100% { opacity: 1; filter: brightness(1); } 50% { opacity: .85; filter: brightness(1.3); } }

    /* GOLD */
    .fx-gold .aura {
      position: absolute; inset: -18px; border-radius: 50%;
      background: radial-gradient(circle, rgba(254,249,195,.9), rgba(251,191,36,.55) 50%, transparent 72%);
      animation: firePulse 1.4s ease-in-out infinite alternate; z-index: 0;
    }
    .fx-gold .ring {
      position: absolute; inset: -6px; border-radius: 50%;
      border: 4px solid #fbbf24; box-shadow: 0 0 16px #f59e0b; z-index: 1;
    }
    .fx-gold .bar { background: linear-gradient(90deg, #78350f, #fbbf24, #78350f); background-size: 200% 100%; animation: barMove 2s linear infinite; }

    /* ICE */
    .fx-ice .aura {
      position: absolute; inset: -18px; border-radius: 50%;
      background: radial-gradient(circle, rgba(224,242,254,.95), rgba(34,211,238,.5) 45%, transparent 70%);
      animation: firePulse 1.6s ease-in-out infinite alternate; z-index: 0;
    }
    .fx-ice .shard {
      position: absolute; width: 8px; height: 20px; background: linear-gradient(#ecfeff, #22d3ee);
      border-radius: 2px; opacity: .8; z-index: 1; animation: shardFloat 2s ease-in-out infinite;
    }
    .fx-ice .shard:nth-child(2) { left: 10%; top: 20%; animation-delay: .3s; }
    .fx-ice .shard:nth-child(3) { right: 12%; top: 30%; animation-delay: .6s; }
    .fx-ice .ring { position: absolute; inset: -6px; border-radius: 50%; border: 3px solid #67e8f9; z-index: 1; }
    .fx-ice .bar { background: linear-gradient(90deg, #0c4a6e, #67e8f9, #0c4a6e); background-size: 200% 100%; animation: barMove 2.2s linear infinite; }
    @keyframes shardFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* STARS */
    .fx-stars .aura {
      position: absolute; inset: -14px; border-radius: 50%;
      background: radial-gradient(circle, rgba(253,230,138,.5), transparent 70%); z-index: 0;
    }
    .fx-stars .star {
      position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 6px #fde68a; animation: twinkle 1.2s ease-in-out infinite; z-index: 1;
    }
    .fx-stars .bar { background: linear-gradient(90deg, #1e1b4b, #fde68a, #1e1b4b); background-size: 200% 100%; animation: barMove 2s linear infinite; }
    @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }

    /* RAINBOW */
    .fx-rainbow .ring {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #f472b6; border-right-color: #a78bfa;
      border-bottom-color: #38bdf8; border-left-color: #4ade80;
      animation: glowSpin 2.5s linear infinite; z-index: 1;
    }
    .fx-rainbow .aura {
      position: absolute; inset: -20px; border-radius: 50%;
      background: conic-gradient(from 0deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444);
      opacity: .35; animation: glowSpin 4s linear infinite reverse; z-index: 0;
    }
    .fx-rainbow .bar {
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7);
      background-size: 200% 100%; animation: barMove 2s linear infinite;
    }

    /* SHADOW */
    .fx-shadow .aura {
      position: absolute; inset: -8px  -8px -20px; border-radius: 50%;
      background: radial-gradient(circle at 55% 60%, rgba(0,0,0,.7), transparent 65%);
      z-index: 0;
    }
    .fx-shadow .ring {
      position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #64748b; z-index: 1;
    }
    .fx-shadow .bar { background: linear-gradient(90deg, #0f172a, #64748b, #0f172a); background-size: 200% 100%; animation: barMove 3s linear infinite; }

    @keyframes barMove { to { background-position: 200% 0; } }

    /* Modal compra */
    .modal-bg {
      position: fixed; inset: 0; z-index: 50; background: rgba(2,6,23,.78);
      display: none; align-items: center; justify-content: center; padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(400px,100%); background: linear-gradient(160deg,#1e1b4b,#0f172a);
      border: 1px solid rgba(240,171,252,.4); border-radius: 18px; overflow: hidden;
    }
    .modal .preview-stage { height: 200px; }
    .modal .mbody { padding: 18px 20px 20px; }
    .modal h2 { margin: 0 0 8px; }
    .modal p { color: var(--muted); margin: 0 0 12px; }
    .mprice { font-size: 1.3rem; font-weight: 800; color: #f0abfc; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button {
      flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-buy { background: linear-gradient(135deg,#a855f7,#db2777); color: #fff; }
    .btn-cancel { background: #334155; color: #fff; }

    /* Demo pós-compra */
    .demo-bg {
      position: fixed; inset: 0; z-index: 70; background: rgba(2,6,23,.88);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(10px);
    }
    .demo-bg.open { display: flex; }
    .demo-stage {
      width: min(320px, 90vw); height: 320px; border-radius: 24px;
      background: linear-gradient(160deg, #1e1b4b, #0f172a);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      border: 1px solid rgba(240,171,252,.4);
      box-shadow: 0 0 60px rgba(168,85,247,.35);
    }
    .demo-stage .avatar-wrap { width: 140px; height: 140px; }
    .demo-stage .avatar-core { width: 100px; height: 100px; font-size: 2.2rem; }
    .demo-stage .avatar-core::after { font-size: 2.4rem; }
    .demo-title {
      margin-top: 20px; font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(90deg,#f0abfc,#fde68a); -webkit-background-clip: text;
      background-clip: text; color: transparent;
    }
    .demo-sub { color: var(--muted); margin-top: 8px; text-align: center; }
    .demo-close {
      margin-top: 18px; padding: 10px 22px; border-radius: 12px; border: none;
      background: #334155; color: #fff; font-weight: 700; cursor: pointer;
    }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: #1e1b4b; border: 1px solid rgba(240,171,252,.5); padding: 12px 20px;
      border-radius: 14px; opacity: 0; transition: .25s; z-index: 80; font-weight: 600;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="nav-menu">
    <button class="nav-toggle" id="navToggle" type="button">☰</button>
    <div class="nav-panel" id="navPanel">
      <a href="/decoracoes" id="linkDecor">🎨 Decorações</a>
      <a href="/itens" id="linkItens">🎁 Itens</a>
      <a href="/efeitos" class="active" id="linkFx">✨ Efeitos</a>
      <a href="/dashboard">⚙️ Painel</a>
      <a href="/login">🔐 Login</a>
    </div>
  </div>
  <header>
    <h1>✦ Efeitos Especiais ✦</h1>
    <p>Prévia ao vivo de cada efeito. Ao comprar, você vê a demonstração na hora.</p>
    <div class="bal" id="bal">Carregando…</div>
  </header>
  <div class="msg" id="status">Carregando…</div>
  <div class="grid" id="grid"></div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="preview-stage" id="mPreview"></div>
      <div class="mbody">
        <h2 id="mName"></h2>
        <p id="mDesc"></p>
        <div class="mprice" id="mPrice"></div>
        <div class="modal-actions">
          <button class="btn-buy" id="mBuy">Comprar</button>
          <button class="btn-cancel" id="mCancel">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="demo-bg" id="demoBg">
    <div class="demo-stage" id="demoStage"></div>
    <div class="demo-title" id="demoTitle">Efeito ativado!</div>
    <div class="demo-sub">Visível no seu O.perfil agora</div>
    <button class="demo-close" id="demoClose" type="button">Fechar</button>
  </div>

  <div id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const guildId = params.get('guild') || '';
    let current = null, currentOwned = false;

    if (guildId) {
      document.getElementById('linkDecor').href = '/decoracoes?guild=' + guildId;
      document.getElementById('linkItens').href = '/itens?guild=' + guildId;
      document.getElementById('linkFx').href = '/efeitos?guild=' + guildId;
    }

    document.getElementById('navToggle').onclick = () =>
      document.getElementById('navPanel').classList.toggle('open');
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-menu'))
        document.getElementById('navPanel').classList.remove('open');
    });

    function toast(t) {
      const el = document.getElementById('toast');
      el.textContent = t;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
    function fmt(n) { return Number(n || 0).toLocaleString('pt-BR'); }

    function styleClass(style) {
      return 'fx-' + (style || 'glow');
    }

    /** Monta HTML da prévia animada (como um “vídeo” ao vivo) */
    function previewHTML(style, big) {
      const sc = styleClass(style);
      const core = big ? ' style="width:100px;height:100px"' : '';
      if (style === 'fire') {
        return `<div class="avatar-wrap ${sc}">
          <div class="aura"></div>
          <div class="flame"></div><div class="flame"></div><div class="flame"></div><div class="flame"></div>
          <div class="avatar-core"${core}></div>
        </div><div class="bar"></div>`;
      }
      if (style === 'stars') {
        let stars = '';
        for (let i = 0; i < 12; i++) {
          const x = 10 + Math.random() * 80;
          const y = 10 + Math.random() * 80;
          stars += `<span class="star" style="left:${x}%;top:${y}%;animation-delay:${(i*0.1).toFixed(1)}s"></span>`;
        }
        return `<div class="avatar-wrap ${sc}">
          <div class="aura"></div>${stars}
          <div class="avatar-core"${core}></div>
        </div><div class="bar"></div>`;
      }
      if (style === 'ice') {
        return `<div class="avatar-wrap ${sc}">
          <div class="aura"></div>
          <div class="shard" style="left:8%;top:15%"></div>
          <div class="shard"></div><div class="shard"></div>
          <div class="ring"></div>
          <div class="avatar-core"${core}></div>
        </div><div class="bar"></div>`;
      }
      // glow, neon, gold, rainbow, shadow
      return `<div class="avatar-wrap ${sc}">
        <div class="aura"></div>
        <div class="ring"></div>
        <div class="avatar-core"${core}></div>
      </div><div class="bar"></div>`;
    }

    function openModal(item, owned) {
      current = item; currentOwned = owned;
      document.getElementById('mPreview').innerHTML =
        '<span class="live-tag">AO VIVO</span>' + previewHTML(item.style);
      document.getElementById('mName').textContent = (item.icon || '✨') + ' ' + item.name;
      document.getElementById('mDesc').textContent = item.desc || '';
      document.getElementById('mPrice').textContent = owned ? 'Já na coleção' : '💠 ' + fmt(item.price);
      document.getElementById('mBuy').textContent = owned ? 'Equipar + demonstrar' : 'Comprar agora';
      document.getElementById('modalBg').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBg').classList.remove('open');
      current = null;
    }
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('modalBg').onclick = (e) => {
      if (e.target.id === 'modalBg') closeModal();
    };

    function showDemo(item) {
      const stage = document.getElementById('demoStage');
      stage.innerHTML = '<span class="live-tag">DEMO</span>' + previewHTML(item.style, true);
      // escala maior no demo
      stage.querySelectorAll('.flame').forEach((f) => {
        f.style.width = '28px'; f.style.height = '52px';
      });
      document.getElementById('demoTitle').textContent = (item.icon || '✨') + ' ' + item.name;
      document.getElementById('demoBg').classList.add('open');
    }
    document.getElementById('demoClose').onclick = () => {
      document.getElementById('demoBg').classList.remove('open');
    };

    document.getElementById('mBuy').onclick = async () => {
      if (!current) return;
      const item = current, owned = currentOwned;
      closeModal();

      if (owned) {
        const res = await fetch('/api/shop/equip', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: item.id })
        }).then((r) => r.json());
        if (!res.ok) { toast(res.error || 'Erro'); return; }
        toast('✨ Efeito equipado!');
        showDemo(item);
        load();
        return;
      }

      const res = await fetch('/api/shop/buy', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId: item.id, guildId })
      }).then((r) => r.json());

      if (!res.ok) { toast(res.error || 'Falha na compra'); return; }
      toast('✅ Comprado! Demonstração iniciada…');
      showDemo(item);
      load();
    };

    async function load() {
      const me = await fetch('/api/me').then((r) => r.ok ? r.json() : null).catch(() => null);
      if (!me) {
        document.getElementById('status').textContent = 'Faça login para comprar.';
        document.getElementById('bal').textContent = 'Não autenticado';
      } else {
        document.getElementById('bal').innerHTML =
          '❄️ ' + fmt(me.economy?.flocos) + ' · 💠 ' + fmt(me.economy?.cristais);
      }

      const data = await fetch('/api/shop/effects').then((r) => r.json()).catch(() => null);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!data?.items?.length) {
        document.getElementById('status').textContent = 'Nenhum efeito.';
        return;
      }
      document.getElementById('status').textContent =
        data.items.length + ' efeitos · prévia ao vivo em cada card';

      const owned = new Set(data.owned || []);
      const eq = data.equipped?.effect || null;

      data.items.forEach((item) => {
        const isOwned = owned.has(item.id);
        const card = document.createElement('div');
        card.className = 'card';
        let badge = '';
        if (eq === item.id) badge = '<span class="badge">EQUIPADO</span>';
        else if (isOwned) badge = '<span class="badge">NA COLEÇÃO</span>';

        card.innerHTML = `
          <div class="preview-stage">
            <span class="live-tag">AO VIVO</span>
            ${previewHTML(item.style)}
          </div>
          <div class="body">
            <h3>${item.icon || '✨'} ${item.name}</h3>
            <p class="desc">${item.desc || ''}</p>
            <div class="price">💠 ${fmt(item.price)}</div>
            ${badge}
          </div>`;
        card.onclick = () => openModal(item, isOwned);
        grid.appendChild(card);
      });
    }

    load();
  </script>
</body>
</html>
