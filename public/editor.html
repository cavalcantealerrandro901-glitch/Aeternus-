<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aeternus — IA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0c10;--panel:#0d1117;--border:#21262d;--text:#e6edf3;--muted:#8b949e;
  --accent:#58a6ff;--green:#3fb950;--red:#f85149;--user:#1f6feb33;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
}
header{
  display:flex;align-items:center;gap:.75rem;
  padding:.55rem 1rem;background:#010409;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
header .logo{font-weight:700;letter-spacing:.02em}
header .logo span{color:var(--accent)}
header a{color:var(--muted);text-decoration:none;font-size:.85rem}
header a:hover{color:var(--text)}
.badge{
  font-size:.68rem;padding:.15rem .5rem;border-radius:999px;
  background:#12261a;color:var(--green);border:1px solid #1a3d28;
}
main{
  flex:1;display:flex;flex-direction:column;min-height:0;
  max-width:820px;width:100%;margin:0 auto;
}
#msgs{
  flex:1;overflow:auto;padding:1.25rem 1rem;
  display:flex;flex-direction:column;gap:.85rem;
}
.bubble{
  max-width:92%;padding:.75rem .9rem;border-radius:14px;
  font-size:.92rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;
}
.bubble.user{
  align-self:flex-end;background:var(--user);
  border:1px solid #388bfd55;
}
.bubble.bot{
  align-self:flex-start;background:var(--panel);
  border:1px solid var(--border);
}
.bubble .meta{
  font-size:.72rem;color:var(--muted);margin-bottom:.4rem;
  font-family:'JetBrains Mono',monospace;
}
.bubble .meta .ok{color:var(--green)}
.bubble .meta .err{color:var(--red)}
.bubble pre{
  margin-top:.5rem;padding:.65rem;border-radius:8px;
  background:#010409;overflow:auto;max-height:320px;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;
  border:1px solid var(--border);
}
.composer{
  padding:.75rem 1rem 1rem;border-top:1px solid var(--border);
  background:#010409;
}
.composer-row{
  display:flex;gap:.5rem;align-items:flex-end;
}
.composer textarea{
  flex:1;min-height:48px;max-height:160px;resize:vertical;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  color:var(--text);padding:.7rem .85rem;font:inherit;outline:none;
}
.composer textarea:focus{border-color:var(--accent)}
.composer button{
  background:#238636;color:#fff;border:none;border-radius:12px;
  padding:.7rem 1.1rem;font-weight:700;cursor:pointer;font-size:.9rem;
}
.composer button:disabled{opacity:.5;cursor:wait}
.hint{font-size:.75rem;color:var(--muted);margin-top:.45rem}
</style>
</head>
<body>
<header>
  <div class="logo"><span>AET</span>ERNUS</div>
  <span class="badge">IA</span>
  <a href="index.html">Início</a>
  <a href="dashboard.html">Painel</a>
  <span style="flex:1"></span>
  <span style="font-size:.75rem;color:var(--muted)">grava no GitHub → Render deploy</span>
</header>

<main>
  <div id="msgs">
    <div class="bubble bot">Manda o que precisa: criar comando, editar arquivo ou colar o erro do Render.\nEu leio o código, conserto, <b>commit no GitHub</b> e o Render faz deploy sozinho.</div>
  </div>
  <div class="composer">
    <div class="composer-row">
      <textarea id="input" placeholder="ex: cria o comando daily · conserta este erro: …" rows="2"></textarea>
      <button type="button" id="btn" onclick="send()">Enviar</button>
    </div>
    <div class="hint">Alterações vão para o repositório (GITHUB_TOKEN). Sem terminal.</div>
  </div>
</main>

<script>
const API = '/api/editor';

function headers() {
  const h = { 'Content-Type': 'application/json' };
  const s = localStorage.getItem('panel_secret') || '';
  if (s) h['x-panel-secret'] = s;
  return h;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({ ok: false, error: 'resposta inválida' }));
  if (res.status === 401) {
    const secret = prompt('PANEL_SECRET:');
    if (secret != null) {
      localStorage.setItem('panel_secret', secret);
      return api(path, opts);
    }
  }
  return data;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function extractCodeBlocks(reply) {
  const blocks = [];
  const re = /```([\w.+-]*)?(?:\s+[\w./-]*)?\n?([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(reply))) {
    blocks.push({ lang: (m[1] || '').trim(), code: (m[2] || '').replace(/\n$/, '') });
  }
  return blocks;
}

function addBubble(role, html) {
  const box = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.innerHTML = html;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addBubble('user', esc(msg));
  const loading = addBubble('bot', '<span style="opacity:.7">analisando…</span>');
  btn.disabled = true;

  const data = await api('/chat', {
    method: 'POST',
    body: JSON.stringify({ message: msg, currentPath: null, editorContent: null })
  });

  loading.remove();
  btn.disabled = false;

  const reply = data.reply || data.error || 'sem resposta';
  let meta = '';

  if (data.readFiles && data.readFiles.length) {
    meta += '<div class="meta">leu: ' + esc(data.readFiles.map((f) => f.path).join(', ')) + '</div>';
  }
  if (data.written && data.written.length) {
    meta +=
      '<div class="meta">' +
      data.written
        .map((w) => {
          if (!w.ok) return '<span class="err">✗ ' + esc(w.path) + ' ' + esc(w.error || '') + '</span>';
          let s = '<span class="ok">✓ ' + esc(w.path) + ' (' + (w.bytes || 0) + ' B)</span>';
          if (w.github) {
            s += w.github.ok
              ? ' <span class="ok">· GitHub commit</span>'
              : ' <span class="err">· GitHub: ' + esc(w.github.error || 'falhou') + '</span>';
          }
          return s;
        })
        .join('<br>') +
      '</div>';
  }
  if (data.syntaxChecks && data.syntaxChecks.length) {
    meta +=
      '<div class="meta">' +
      data.syntaxChecks
        .map((c) =>
          c.ok
            ? '<span class="ok">✓ syntax ' + esc(c.path) + '</span>'
            : '<span class="err">✗ syntax ' + esc(c.path) + ': ' + esc(c.error || '') + '</span>'
        )
        .join('<br>') +
      '</div>';
  }

  // texto sem blocos de código gigantes no bubble (mostra preview)
  let text = reply;
  const blocks = extractCodeBlocks(reply);
  if (blocks.length) {
    text = reply.replace(/```[\s\S]*?```/g, '').trim() || 'Arquivo atualizado.';
  }

  let codeHtml = '';
  for (const b of blocks.slice(0, 3)) {
    codeHtml += '<pre>' + esc(b.code.slice(0, 4000)) + (b.code.length > 4000 ? '\n…' : '') + '</pre>';
  }

  addBubble('bot', meta + esc(text) + codeHtml);
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
