<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Aeternus · Arena 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--accent:#c4b5fd;--hp:#f43f5e;--mana:#38bdf8;--gold:#fbbf24;--panel:rgba(8,6,18,.78);--line:rgba(255,255,255,.14);--depth:900px}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{font-family:Rajdhani,system-ui,sans-serif;color:#f1f5f9;background:#02010a;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;perspective:var(--depth);perspective-origin:50% 42%;overflow:hidden}
#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#2a1650 0%,#0a0618 45%,#02010a 100%);transition:background 1.4s ease;z-index:0}
#sky::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(167,139,250,.15),transparent 35%),radial-gradient(circle at 80% 20%,rgba(56,189,248,.12),transparent 30%);pointer-events:none}
canvas#world{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.ground{position:absolute;left:50%;bottom:8%;width:160vmax;height:90vmax;transform:translateX(-50%) rotateX(72deg);transform-origin:center top;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 100%),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 48px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 48px);background-color:#1a1230;border-radius:50%;box-shadow:0 -40px 120px rgba(124,58,237,.25);z-index:2;opacity:.85;transition:background-color 1.2s ease}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%)}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:#fff;mix-blend-mode:screen}
.hud{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:12px}
.brand{font-family:Cinzel,serif;font-weight:800;letter-spacing:.18em;font-size:.82rem;text-transform:uppercase;background:linear-gradient(90deg,#e9d5ff,#67e8f9,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.pill{font-size:.75rem;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.4);letter-spacing:.04em}
.battlefield{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(24px,8vw,120px);padding:0 16px 4vh;transform-style:preserve-3d;min-height:0}
.fighter{width:min(280px,42vw);transform-style:preserve-3d;transform:translateZ(0) rotateY(-6deg);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s;position:relative}
.fighter.right{transform:translateZ(0) rotateY(6deg)}
.fighter.active{transform:translateZ(40px) translateY(-8px) rotateY(0) scale(1.04);filter:drop-shadow(0 0 28px color-mix(in srgb,var(--accent) 55%,transparent))}
.fighter.right.active{transform:translateZ(40px) translateY(-8px) rotateY(0) scale(1.04)}
.portrait-frame{position:relative;border-radius:20px 20px 12px 12px;padding:3px;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.05),rgba(167,139,250,.4));box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.2);transform:rotateX(4deg)}
.portrait-inner{border-radius:17px 17px 10px 10px;overflow:hidden;background:linear-gradient(180deg,#1e1b4b,#0f0a1e);aspect-ratio:3/4;position:relative;display:grid;place-items:center}
.portrait-inner img{width:100%;height:100%;object-fit:cover;display:block}
.portrait-emoji{font-size:clamp(4rem,12vw,6.5rem);filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));animation:floatY 3.2s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.portrait-glow{position:absolute;inset:auto 10% 0;height:40%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 40%,transparent),transparent 70%);pointer-events:none}
.class-badge{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--line);backdrop-filter:blur(8px);letter-spacing:.06em;text-transform:uppercase}
.fighter-info{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.45);transform:translateZ(20px)}
.fname{font-family:Cinzel,serif;font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-align:center;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.bar-row{margin-top:6px}.bar-meta{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;opacity:.9;margin-bottom:3px;letter-spacing:.04em}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.bar>i{display:block;height:100%;width:0%;border-radius:inherit;transition:width .5s cubic-bezier(.2,.85,.2,1);position:relative}
.bar.hp>i{background:linear-gradient(90deg,#9f1239,var(--hp),#fda4af);box-shadow:0 0 12px rgba(244,63,94,.5)}
.bar.mana>i{background:linear-gradient(90deg,#0369a1,var(--mana),#bae6fd);box-shadow:0 0 12px rgba(56,189,248,.45)}
.bar>i::after{content:'';position:absolute;inset:0 0 auto 0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent)}
.center-hud{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:12;text-align:center;width:min(520px,92vw);pointer-events:none}
.round-tag{font-family:Cinzel,serif;font-size:clamp(1rem,3vw,1.35rem);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 24px rgba(251,191,36,.45),0 2px 8px rgba(0,0,0,.8);margin-bottom:8px}
.log-box{pointer-events:auto;padding:12px 16px;border-radius:16px;background:linear-gradient(180deg,rgba(20,12,40,.85),rgba(8,6,18,.9));border:1px solid var(--line);box-shadow:0 16px 48px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(20px);font-size:clamp(.9rem,2.4vw,1.05rem);font-weight:600;line-height:1.4;min-height:52px;display:flex;align-items:center;justify-content:center}
.skillbar{position:relative;z-index:15;padding:12px 14px 22px;max-width:720px;width:100%;margin:0 auto}
.hint{text-align:center;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.skill{appearance:none;border:0;cursor:pointer;position:relative;border-radius:18px;padding:14px 8px 12px;color:#fff;font-family:inherit;font-weight:700;font-size:.88rem;letter-spacing:.03em;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(0,0,0,.25)),linear-gradient(180deg,#2a1f4d,#120c24);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s,filter .15s,opacity .2s;overflow:hidden}
.skill::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.12),transparent 55%);pointer-events:none}
.skill .ico{display:block;font-size:1.55rem;margin-bottom:4px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.skill .cost{display:block;font-size:.68rem;font-weight:600;opacity:.7;margin-top:2px}
.skill:hover:not(:disabled){transform:translateY(-4px) scale(1.02);filter:brightness(1.12);box-shadow:0 16px 36px rgba(0,0,0,.5),0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.skill:active:not(:disabled){transform:translateY(-1px) scale(.98)}
.skill:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.4)}
.skill.special{background:linear-gradient(160deg,rgba(251,191,36,.25),rgba(167,139,250,.15) 40%,rgba(0,0,0,.3)),linear-gradient(180deg,#4c1d95,#1e1035);border-color:rgba(251,191,36,.35)}
.skill.special .ico{font-size:1.7rem}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.8);border:1px solid var(--line);font-weight:600;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.dmg-float{position:fixed;z-index:25;pointer-events:none;font-family:Cinzel,serif;font-weight:800;font-size:1.6rem;color:#fecaca;text-shadow:0 0 12px #f43f5e,0 2px 4px #000;animation:riseDmg .9s ease-out forwards}
@keyframes riseDmg{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1.3)}}
@media(max-width:640px){.skills{grid-template-columns:1fr 1fr}.fighter{width:min(160px,44vw)}.portrait-emoji{font-size:3rem}.center-hud{top:12%}.battlefield{gap:12px;padding-bottom:2vh}}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <canvas id="world"></canvas>
  <div class="ground" id="ground"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="hud">
    <div class="topbar">
      <div class="brand">✦ Aeternus Arena</div>
      <div class="pill" id="landTag">—</div>
    </div>
    <div class="center-hud">
      <div class="round-tag" id="round">Rodada 1</div>
      <div class="log-box" id="log">Carregando arena 3D…</div>
    </div>
    <div class="battlefield">
      <div class="fighter" id="cardA">
        <div class="portrait-frame"><div class="portrait-inner" id="avA"><span class="portrait-emoji" id="emojiA">⚔️</span><div class="portrait-glow"></div><div class="class-badge" id="clsA">—</div></div></div>
        <div class="fighter-info"><div class="fname" id="nameA">—</div>
          <div class="bar-row"><div class="bar-meta"><span>HP</span><span id="hpA">0/0</span></div><div class="bar hp"><i id="hpBarA"></i></div></div>
          <div class="bar-row"><div class="bar-meta"><span>MANA</span><span id="mpA">0/0</span></div><div class="bar mana"><i id="mpBarA"></i></div></div>
        </div>
      </div>
      <div class="fighter right" id="cardB">
        <div class="portrait-frame"><div class="portrait-inner" id="avB"><span class="portrait-emoji" id="emojiB">⚔️</span><div class="portrait-glow"></div><div class="class-badge" id="clsB">—</div></div></div>
        <div class="fighter-info"><div class="fname" id="nameB">—</div>
          <div class="bar-row"><div class="bar-meta"><span>HP</span><span id="hpB">0/0</span></div><div class="bar hp"><i id="hpBarB"></i></div></div>
          <div class="bar-row"><div class="bar-meta"><span>MANA</span><span id="mpB">0/0</span></div><div class="bar mana"><i id="mpBarB"></i></div></div>
        </div>
      </div>
    </div>
    <div class="skillbar">
      <div class="hint" id="hint">Aguardando…</div>
      <div class="skills" id="moves"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const path=location.pathname.split('/').filter(Boolean);
const fightId=path[path.length-1];
const me=new URLSearchParams(location.search).get('as')||'';
const el=id=>document.getElementById(id);
const toast=msg=>{const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
const canvas=el('world');const ctx=canvas.getContext('2d');
let W=0,H=0,particles=[],stars=[],mist=[],landscape=null,anim=0;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';stars=Array.from({length:120},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.8+.3,tw:Math.random()*Math.PI*2,s:.5+Math.random()}));mist=Array.from({length:18},()=>({x:Math.random(),y:.55+Math.random()*.3,w:.15+Math.random()*.25,a:.04+Math.random()*.06,sp:.01+Math.random()*.02}))}
function draw(){anim+=.016;ctx.clearRect(0,0,W,H);for(const s of stars){const a=.25+Math.sin(anim*s.s+s.tw)*.3;ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*devicePixelRatio,0,Math.PI*2);ctx.fill()}for(const m of mist){m.x+=m.sp*.002;if(m.x>1.2)m.x=-.2;const grd=ctx.createRadialGradient(m.x*W,m.y*H,0,m.x*W,m.y*H,m.w*W);grd.addColorStop(0,`rgba(180,160,255,${m.a})`);grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.fillRect(m.x*W-m.w*W,m.y*H-m.w*W*.3,m.w*W*2,m.w*W*.6)}particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=.018;p.x+=p.vx;p.y+=p.vy;p.vy+=.04;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
function burst(kind){const colors={attack:['#e9d5ff','#a78bfa','#f8fafc'],heavy:['#fb923c','#f97316','#fdba74'],special:['#fbbf24','#f472b6','#67e8f9','#c4b5fd'],defend:['#94a3b8','#cbd5e1','#e2e8f0']};const cols=colors[kind]||colors.attack;const cx=W/2,cy=H*.42;for(let i=0;i<48;i++){const ang=Math.random()*Math.PI*2;const sp=2.5+Math.random()*7;particles.push({x:cx,y:cy,vx:Math.cos(ang)*sp*devicePixelRatio,vy:Math.sin(ang)*sp*devicePixelRatio-1,r:(2+Math.random()*3.5)*devicePixelRatio,life:.85+Math.random()*.4,color:cols[i%cols.length]})}const flash=el('flash');flash.style.transition='none';flash.style.opacity='.4';flash.style.background=cols[0];requestAnimationFrame(()=>{flash.style.transition='opacity .4s ease';flash.style.opacity='0'})}
function floatDmg(text){const n=document.createElement('div');n.className='dmg-float';n.textContent=text;n.style.left=(48+Math.random()*4)+'%';n.style.top=(40+Math.random()*8)+'%';document.body.appendChild(n);setTimeout(()=>n.remove(),950)}
function setSky(land){if(!land)return;landscape=land;el('sky').style.background=`radial-gradient(ellipse at 50% 0%,${land.sky[1]} 0%,${land.sky[0]} 45%,#02010a 100%)`;document.documentElement.style.setProperty('--accent',land.accent||'#c4b5fd');el('ground').style.backgroundColor=land.ground||'#1a1230';el('landTag').textContent='🗺 '+(land.name||land.id)}
function fillFighter(side,f,turnId){if(!f)return;el('name'+side).textContent=f.name;el('cls'+side).textContent=(f.emoji||'⚔️')+' '+(f.className||f.classId);el('hp'+side).textContent=f.hp+' / '+f.maxHp;el('mp'+side).textContent=f.mana+' / '+f.maxMana;el('hpBar'+side).style.width=Math.max(0,(f.hp/Math.max(1,f.maxHp))*100)+'%';el('mpBar'+side).style.width=Math.max(0,(f.mana/Math.max(1,f.maxMana))*100)+'%';const box=el('av'+side);const em=el('emoji'+side);let img=box.querySelector('img');if(f.photo){if(!img){img=document.createElement('img');img.alt=f.name;box.insertBefore(img,box.firstChild)}img.src=f.photo;if(em)em.style.display='none'}else{if(img)img.remove();if(em){em.style.display='';em.textContent=f.emoji||'⚔️'}}el('card'+side).classList.toggle('active',String(f.id)===String(turnId)&&!window.__over)}
function renderMoves(state){const box=el('moves');box.innerHTML='';const myTurn=me&&String(state.turn)===String(me)&&!state.over;el('hint').textContent=state.over?(String(state.winnerId)===String(me)?'🏆 Vitória!':'Duelo encerrado'):myTurn?'▶ Sua vez — escolha a habilidade':'⏳ Aguardando oponente…';(state.moves||[]).forEach(m=>{const b=document.createElement('button');b.className='skill'+(m.key==='special'?' special':'');b.disabled=!myTurn||m.disabled||state.over;b.innerHTML='<span class="ico">'+m.emoji+'</span><span>'+m.label+'</span><span class="cost">'+(m.cost?'⚡ '+m.cost+' mana':'Livre')+'</span>';b.onclick=()=>doMove(m.key);box.appendChild(b)})}
let lastLog='';
function render(state){if(!state)return;window.__over=state.over;if(state.landscape)setSky(state.landscape);fillFighter('A',state.a,state.turn);fillFighter('B',state.b,state.turn);el('round').textContent=state.over?'◆ Fim de batalha ◆':'Rodada '+state.round;const log=(state.lastLog||'').replace(/\*\*/g,'');el('log').textContent=log;if(log&&log!==lastLog&&/[−-]\d+/.test(log)){const m=log.match(/[−-](\d+)/);if(m)floatDmg('-'+m[1])}lastLog=log;renderMoves(state)}
async function load(){try{const r=await fetch('/api/pvp/'+fightId+(me?'?as='+encodeURIComponent(me):''));if(!r.ok){el('log').textContent='Arena não encontrada ou expirada.';return}render(await r.json())}catch(_){el('log').textContent='Falha ao conectar na arena.'}}
async function doMove(kind){if(!me){toast('Abra o link que o bot enviou para você.');return}const r=await fetch('/api/pvp/'+fightId+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:me,move:kind})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok){toast(data.error||'Falha no movimento');return}burst(kind);render(data.state)}
setInterval(load,1800);resize();addEventListener('resize',resize);draw();load();
})();
</script>
</body>
</html>
