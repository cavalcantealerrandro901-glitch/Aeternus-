<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Aeternus · Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--a:#a78bfa;--g:#fbbf24;--panel:rgba(12,8,24,.9);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05040c;color:#f1f5f9;font-family:Rajdhani,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#2a1650,#0a0618 55%,#02010a);z-index:0}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
.hud{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;justify-content:space-between;padding:10px 14px;gap:8px;flex-wrap:wrap}
.brand{font-family:Cinzel,serif;letter-spacing:.12em;font-size:.8rem;background:linear-gradient(90deg,#e9d5ff,#67e8f9,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.72rem}
.arena-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px 140px;min-height:0}
.ring{position:relative;width:min(92vw,480px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(251,191,36,.12),transparent 30%),
  radial-gradient(circle at 50% 45%,rgba(167,139,250,.2),transparent 55%),
  repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 6deg,transparent 6deg 12deg),
  radial-gradient(circle at 50% 50%,#241a45,#0c0818 70%);
  border:3px solid rgba(196,181,253,.5);
  box-shadow:0 0 0 10px rgba(124,58,237,.12),0 20px 60px rgba(0,0,0,.55),0 0 80px rgba(124,58,237,.3),inset 0 0 80px rgba(0,0,0,.5)}
.ring::after{content:'2 m';position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:.62rem;opacity:.4;font-family:Cinzel,serif;letter-spacing:.15em}
.center{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;border:2px solid rgba(251,191,36,.55)}
.fighter{position:absolute;width:min(120px,26vw);transform:translate(-50%,-50%);transition:left .4s cubic-bezier(.2,.85,.2,1),top .4s cubic-bezier(.2,.85,.2,1);z-index:5}
.portrait{aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.2);background:linear-gradient(180deg,#1e1b4b,#0f0a1e);box-shadow:0 12px 28px rgba(0,0,0,.5);position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .em{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem}
.fname{text-align:center;font-family:Cinzel,serif;font-size:.72rem;margin-top:4px;text-shadow:0 2px 6px #000}
.bar{height:5px;border-radius:99px;background:rgba(0,0,0,.4);margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.bar.hp i{background:linear-gradient(90deg,#fb7185,#f43f5e)}
.bar.mp i{background:linear-gradient(90deg,#7dd3fc,#0ea5e9)}
.fighter.active .portrait{box-shadow:0 0 20px rgba(167,139,250,.55),0 12px 28px rgba(0,0,0,.5);border-color:var(--g)}
.fighter.anim-attack{animation:lunge .5s ease}
.fighter.anim-heavy{animation:slam .6s ease}
.fighter.anim-special{animation:spec .75s ease}
.fighter.anim-defend{animation:guard .5s ease}
.fighter.anim-hurt{animation:hurt .35s ease}
@keyframes lunge{0%,100%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-58%) scale(1.08)}}
@keyframes slam{0%,100%{transform:translate(-50%,-50%)}30%{transform:translate(-50%,-62%)}55%{transform:translate(-50%,-46%) scale(1.1)}}
@keyframes spec{0%,100%{transform:translate(-50%,-50%) rotate(0)}40%{transform:translate(-50%,-55%) rotate(-6deg) scale(1.12)}70%{transform:translate(-50%,-52%) rotate(6deg)}}
@keyframes guard{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-48%) scale(.92)}}
@keyframes hurt{0%,100%{transform:translate(-50%,-50%)}30%{transform:translate(-56%,-50%) rotate(-4deg)}60%{transform:translate(-44%,-50%)}}
.logbox{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(400px,90vw);text-align:center;z-index:12;pointer-events:none}
.round{font-family:Cinzel,serif;font-size:.8rem;margin-bottom:4px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.82rem}
.controls{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 12px 14px;background:linear-gradient(180deg,transparent,rgba(2,1,10,.95) 25%)}
.hint{text-align:center;font-size:.78rem;opacity:.8;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 2fr;gap:8px;max-width:600px;margin:0 auto}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.row{display:grid;gap:6px}
.mob{grid-template-columns:1fr 1fr}
.pow{grid-template-columns:repeat(4,1fr)}
@media(max-width:520px){.pow{grid-template-columns:1fr 1fr}}
.btn{appearance:none;border:1px solid var(--line);border-radius:12px;padding:10px 6px;color:#fff;font-family:inherit;font-weight:700;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.3)),linear-gradient(180deg,#2a1f4d,#120c24)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn .ico{display:block;font-size:1.2rem}
.btn.move{background:linear-gradient(160deg,rgba(56,189,248,.2),rgba(0,0,0,.3)),linear-gradient(180deg,#1e3a5f,#0f172a)}
.btn.special{border-color:rgba(251,191,36,.35)}
.sec{font-size:.62rem;opacity:.55;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--line);padding:8px 14px;border-radius:999px;opacity:0;transition:.25s;z-index:40;font-size:.85rem}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <canvas id="fx"></canvas>
  <div class="hud">
    <div class="top">
      <div class="brand">✦ ARENA CIRCULAR · 2 m</div>
      <div class="pill" id="land">—</div>
    </div>
    <div class="logbox"><div class="round" id="round">Rodada 1</div><div class="log" id="log">Entrando…</div></div>
    <div class="arena-wrap">
      <div class="ring" id="ring">
        <div class="center"></div>
        <div class="fighter" id="fA"><div class="portrait" id="pA"><span class="em" id="eA">⚔️</span></div><div class="fname" id="nA">—</div><div class="bar hp"><i id="hpA"></i></div><div class="bar mp"><i id="mpA"></i></div></div>
        <div class="fighter" id="fB"><div class="portrait" id="pB"><span class="em" id="eB">⚔️</span></div><div class="fname" id="nB">—</div><div class="bar hp"><i id="hpB"></i></div><div class="bar mp"><i id="mpB"></i></div></div>
      </div>
    </div>
    <div class="controls">
      <div class="hint" id="hint">…</div>
      <div class="grid">
        <div><div class="sec">Mover</div><div class="row mob" id="mob"></div></div>
        <div><div class="sec">Poderes da classe</div><div class="row pow" id="pow"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const fightId=location.pathname.split('/').filter(Boolean).pop();
const me=new URLSearchParams(location.search).get('as')||'';
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};
const fx=$('fx'),ctx=fx.getContext('2d');let W=0,H=0,parts=[],stars=[];
function resize(){W=fx.width=innerWidth*devicePixelRatio;H=fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';
stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random()*.55,r:Math.random()*1.5+.3,tw:Math.random()*6,s:.5+Math.random()}))}
let t0=0;
function draw(){t0+=.016;ctx.clearRect(0,0,W,H);for(const s of stars){const a=.2+Math.sin(t0*s.s+s.tw)*.25;ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*devicePixelRatio,0,Math.PI*2);ctx.fill()}
parts=parts.filter(p=>p.life>0);for(const p of parts){p.life-=.02;p.x+=p.vx;p.y+=p.vy;p.vy+=.05;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
function burst(side){const f=$(side==='B'?'fB':'fA').getBoundingClientRect();const cx=(f.left+f.width/2)*devicePixelRatio,cy=(f.top+f.height/2)*devicePixelRatio;
for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp*devicePixelRatio,vy:Math.sin(a)*sp*devicePixelRatio-1,r:(1.5+Math.random()*2.5)*devicePixelRatio,life:.7+Math.random()*.3,c:['#e9d5ff','#a78bfa','#fbbf24','#38bdf8'][i%4]})}}
function laneXY(lane,isB){const base=isB?35:145,spread=38,deg=base+lane*(isB?-spread:spread),rad=deg*Math.PI/180,r=34;
return{x:50+Math.sin(rad)*r,y:50-Math.cos(rad)*r*.72+6}}
function place(side,lane){const n=$('f'+side),isB=side==='B',p=laneXY(typeof lane==='number'?lane:(isB?1:-1),isB);n.style.left=p.x+'%';n.style.top=p.y+'%'}
function anim(side,kind){const n=$('f'+side);n.classList.remove('anim-attack','anim-heavy','anim-special','anim-defend','anim-hurt');void n.offsetWidth;
const k=['attack','heavy','special','defend','hurt'].includes(kind)?kind:(kind&&kind.startsWith('step')?'attack':'attack');
n.classList.add('anim-'+k);setTimeout(()=>n.classList.remove('anim-'+k),800)}
let lastHp={A:null,B:null},lastFx='';
function fill(side,f,turn){if(!f)return;$('n'+side).textContent=f.name||'—';$('hp'+side).style.width=Math.max(0,(f.hp/Math.max(1,f.maxHp))*100)+'%';$('mp'+side).style.width=Math.max(0,(f.mana/Math.max(1,f.maxMana))*100)+'%';
const box=$('p'+side),em=$('e'+side);let img=box.querySelector('img');const photo=f.photo||null;
if(photo){if(!img){img=document.createElement('img');img.alt=f.name||'';box.insertBefore(img,em)}if(img.src!==photo)img.src=photo;em.style.display='none'}
else{if(img)img.remove();em.style.display='';em.textContent=f.emoji||'⚔️'}
place(side,f.lane);$('f'+side).classList.toggle('active',String(f.id)===String(turn)&&!window.__over);
if(me&&String(f.id)===String(me))window.__mySide=side;
if(lastHp[side]!=null&&f.hp<lastHp[side])anim(side,'hurt');lastHp[side]=f.hp}
function ctrls(st){const my=me&&String(st.turn)===String(me)&&!st.over;
$('hint').textContent=st.over?(String(st.winnerId)===String(me)?'🏆 Vitória!':'Fim'):my?'▶ Sua vez':'⏳ Aguarde…';
const mob=$('mob');mob.innerHTML='';(st.mobility||[{key:'step_left',label:'Esquerda',emoji:'⬅️'},{key:'step_right',label:'Direita',emoji:'➡️'}]).forEach(m=>{const b=document.createElement('button');b.className='btn move';b.disabled=!my||m.disabled||st.over;b.innerHTML=`<span class="ico">${m.emoji}</span>${m.label}`;b.onclick=()=>go(m.key);mob.appendChild(b)});
const pow=$('pow');pow.innerHTML='';(st.moves||[]).forEach(m=>{const b=document.createElement('button');b.className='btn'+(m.key==='special'?' special':'');b.disabled=!my||m.disabled||st.over;b.innerHTML=`<span class="ico">${m.emoji}</span>${m.label}`;b.onclick=()=>go(m.key);pow.appendChild(b)})}
function render(st){if(!st)return;window.__over=st.over;if(st.landscape){const L=st.landscape;$('sky').style.background=`radial-gradient(ellipse at 50% 0%,${L.sky[1]},${L.sky[0]} 55%,#02010a)`;$('land').textContent='🗺 '+(L.name||L.id)}
fill('A',st.a,st.turn);fill('B',st.b,st.turn);$('round').textContent=st.over?'◆ Fim ◆':'Rodada '+st.round;$('log').textContent=(st.lastLog||'').replace(/\*\*/g,'');
if(st.lastEffect){const k=JSON.stringify(st.lastEffect)+st.round;if(k!==lastFx){lastFx=k;const side=st.a&&String(st.a.id)===String(st.lastEffect.actorId)?'A':'B';anim(side,st.lastEffect.kind||'attack');burst(side)}}
ctrls(st)}
async function load(){try{const r=await fetch('/api/pvp/'+fightId+(me?'?as='+encodeURIComponent(me):''));if(!r.ok){$('log').textContent='Arena não encontrada.';return}render(await r.json())}catch(_){$('log').textContent='Falha de conexão.'}}
async function go(kind){if(!me)return toast('Abra o link do bot');const side=window.__mySide||'A';anim(side,kind);burst(side);
const r=await fetch('/api/pvp/'+fightId+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:me,move:kind})});
const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)return toast(d.error||'Falha');render(d.state)}
place('A',-1);place('B',1);resize();addEventListener('resize',resize);draw();setInterval(load,1600);load();
})();
</script>
</body>
</html>
