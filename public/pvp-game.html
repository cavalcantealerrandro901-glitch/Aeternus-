<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Aeternus · Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#05040c;--panel:rgba(12,8,24,.88);--line:rgba(255,255,255,.12);
  --a:#a78bfa;--b:#38bdf8;--ok:#34d399;--dmg:#fb7185;--heal:#6ee7b7;--mana:#60a5fa;
  --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#f8fafc;
  font-family:Rajdhani,system-ui,sans-serif;user-select:none}
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
.arena{
  flex:1;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(124,58,237,.25), transparent 60%),
    linear-gradient(180deg,#0b1020 0%,#1a1040 40%,#2a1848 70%,#1c1230 100%);
}
.arena.bioma-floresta{background:linear-gradient(180deg,#0a1a12 0%,#143328 45%,#1a4020 100%)}
.arena.bioma-vulcao{background:linear-gradient(180deg,#1a0808 0%,#3a1010 40%,#4a1808 100%)}
.arena.bioma-gelo{background:linear-gradient(180deg,#0a1420 0%,#102838 45%,#183848 100%)}
.arena.bioma-deserto{background:linear-gradient(180deg,#1a1208 0%,#3a2810 40%,#4a3018 100%)}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.5}
.stars span{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.ground{
  position:absolute;left:0;right:0;bottom:0;height:28%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.45)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 48px);
  border-top:2px solid rgba(255,255,255,.08);
}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px #fff;animation:spark-fly .7s ease-out forwards}
@keyframes spark-fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.slash{
  position:absolute;width:80px;height:6px;border-radius:4px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  box-shadow:0 0 16px #a78bfa;animation:slash-anim .35s ease-out forwards;z-index:15
}
@keyframes slash-anim{0%{opacity:0;transform:scaleX(.2) rotate(-25deg)}40%{opacity:1}100%{opacity:0;transform:scaleX(1.4) rotate(-25deg)}}
.impact-ring{
  position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:50%;
  animation:ring .45s ease-out forwards;z-index:15
}
@keyframes ring{to{width:90px;height:90px;margin-left:-35px;margin-top:-35px;opacity:0}}
.dmg-float{
  position:absolute;font-family:Orbitron,sans-serif;font-weight:700;font-size:1.4rem;
  text-shadow:0 0 12px currentColor,0 2px 4px #000;animation:float-up 1s ease-out forwards;z-index:25;
  pointer-events:none
}
.dmg-float.crit{font-size:1.9rem;color:#fbbf24}
.dmg-float.heal{color:var(--heal)}
.dmg-float.miss{color:#94a3b8;font-size:1rem}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.15)}}
.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,0)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.flash.on{animation:flash .2s ease}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.fighters{position:absolute;left:0;right:0;bottom:22%;height:55%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6%;z-index:5}
.fighter{
  position:relative;width:min(38vw,200px);display:flex;flex-direction:column;align-items:center;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.fighter.left.lunge{transform:translateX(28vw) scale(1.05)}
.fighter.right.lunge{transform:translateX(-28vw) scale(1.05)}
.fighter.hit{animation:hit-recoil .4s ease}
@keyframes hit-recoil{0%{filter:brightness(2)}30%{transform:translateX(var(--recoil,12px))}100%{filter:brightness(1)}}
.fighter.left.hit{--recoil:-18px}
.fighter.right.hit{--recoil:18px}
.fighter.defend .portrait{box-shadow:0 0 0 4px rgba(56,189,248,.6),0 0 30px rgba(56,189,248,.4)}
.fighter.dead{opacity:.35;filter:grayscale(1);transform:translateY(20px) scale(.9)}
.portrait{
  width:min(34vw,160px);height:min(34vw,160px);border-radius:20px;
  border:3px solid rgba(255,255,255,.2);overflow:hidden;position:relative;
  background:linear-gradient(145deg,#1e1b4b,#312e81);
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 40px rgba(167,139,250,.15);
  transition:box-shadow .25s,transform .25s;
}
.fighter.turn .portrait{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(251,191,36,.5),0 0 40px rgba(251,191,36,.35),0 12px 40px rgba(0,0,0,.5);
  animation:pulse-turn 1.5s ease-in-out infinite;
}
@keyframes pulse-turn{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .emoji-face{font-size:4.5rem;display:flex;align-items:center;justify-content:center;height:100%}
.portrait .aura{
  position:absolute;inset:-20%;background:radial-gradient(circle,rgba(167,139,250,.25),transparent 60%);
  animation:aura-spin 8s linear infinite;pointer-events:none
}
@keyframes aura-spin{to{transform:rotate(360deg)}}
.fname{margin-top:8px;font-family:Cinzel,serif;font-size:.85rem;text-align:center;
  text-shadow:0 2px 8px #000;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:.75rem;opacity:.75;text-align:center}
.bars{width:100%;max-width:160px;margin-bottom:6px}
.bar-row{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.bar-row span{font-size:.65rem;width:28px;opacity:.8}
.bar{flex:1;height:10px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bar > i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp > i{background:linear-gradient(90deg,#e11d48,#fb7185)}
.bar.mana > i{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.hud-top{
  position:absolute;top:0;left:0;right:0;z-index:10;
  padding:12px 14px;display:flex;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
  pointer-events:none;
}
.hud-card{
  flex:1;max-width:220px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;backdrop-filter:blur(10px)
}
.hud-card .name{font-family:Cinzel,serif;font-size:.8rem;margin-bottom:4px}
.turn-badge{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:12;
  background:rgba(0,0,0,.65);border:1px solid var(--gold);color:var(--gold);
  font-family:Orbitron,sans-serif;font-size:.7rem;letter-spacing:.15em;
  padding:6px 16px;border-radius:999px;backdrop-filter:blur(8px);
}
.log{
  position:absolute;left:50%;bottom:34%;transform:translateX(-50%);
  width:min(90%,360px);max-height:72px;overflow:hidden;z-index:12;
  text-align:center;pointer-events:none;
}
.log div{
  font-size:.85rem;padding:4px 8px;margin:2px 0;
  background:rgba(0,0,0,.45);border-radius:8px;animation:log-in .3s ease;
  text-shadow:0 1px 3px #000
}
@keyframes log-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skills{
  position:relative;z-index:15;padding:10px 12px 16px;
  background:linear-gradient(0deg,rgba(5,4,12,.95),rgba(12,8,24,.85));
  border-top:1px solid var(--line);
}
.skills-inner{max-width:560px;margin:0 auto}
.skills-hint{text-align:center;font-size:.75rem;opacity:.6;margin-bottom:8px;min-height:1.1em}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:400px){.btns{grid-template-columns:repeat(2,1fr)}}
.skill{
  appearance:none;border:1px solid var(--line);border-radius:14px;padding:12px 6px;
  background:linear-gradient(180deg,rgba(124,58,237,.2),rgba(15,10,30,.8));
  color:#fff;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;
  transition:transform .12s,border-color .15s,box-shadow .15s;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px
}
.skill .ico{font-size:1.4rem;line-height:1}
.skill:hover:not(:disabled){border-color:var(--a);box-shadow:0 0 20px rgba(167,139,250,.25);transform:translateY(-2px)}
.skill:active:not(:disabled){transform:scale(.96)}
.skill:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.4)}
.skill.special{border-color:rgba(251,191,36,.4);background:linear-gradient(180deg,rgba(251,191,36,.15),rgba(30,15,10,.85))}
.skill.defend{border-color:rgba(56,189,248,.35)}
.end-screen{
  position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s
}
.end-screen.show{opacity:1;pointer-events:auto}
.end-box{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 32px;
  text-align:center;max-width:90%;animation:pop .4s cubic-bezier(.2,1.2,.3,1)
}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.end-box h1{font-family:Cinzel,serif;font-size:1.6rem;margin-bottom:8px;
  background:linear-gradient(90deg,#e9d5ff,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.end-box p{opacity:.8;margin-bottom:16px}
.btn-home{appearance:none;border:none;border-radius:12px;padding:10px 20px;font-family:inherit;font-weight:700;
  background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;cursor:pointer}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;
  background:var(--bg);font-family:Cinzel,serif;letter-spacing:.2em}
.loading.hide{display:none}
</style>
</head>
<body>
<div class="stage">
  <div class="loading" id="loading">CARREGANDO ARENA…</div>
  <div class="arena" id="arena">
    <div class="stars" id="stars"></div>
    <div class="flash" id="flash"></div>
    <div class="fx-layer" id="fx"></div>
    <div class="hud-top">
      <div class="hud-card" id="hudA"></div>
      <div class="hud-card" id="hudB" style="text-align:right"></div>
    </div>
    <div class="turn-badge" id="turnBadge">—</div>
    <div class="fighters">
      <div class="fighter left" id="fA">
        <div class="bars" id="barsA"></div>
        <div class="portrait" id="portA"><div class="aura"></div><div class="emoji-face">⚔️</div></div>
        <div class="fname" id="nameA">—</div>
        <div class="fmeta" id="metaA"></div>
      </div>
      <div class="fighter right" id="fB">
        <div class="bars" id="barsB"></div>
        <div class="portrait" id="portB"><div class="aura"></div><div class="emoji-face">🗡️</div></div>
        <div class="fname" id="nameB">—</div>
        <div class="fmeta" id="metaB"></div>
      </div>
    </div>
    <div class="ground"></div>
    <div class="log" id="log"></div>
  </div>
  <div class="skills">
    <div class="skills-inner">
      <div class="skills-hint" id="hint">Aguarde…</div>
      <div class="btns" id="btns"></div>
    </div>
  </div>
  <div class="end-screen" id="end">
    <div class="end-box">
      <h1 id="endTitle">Fim</h1>
      <p id="endDesc"></p>
      <button class="btn-home" onclick="location.href='/rpg'">Voltar ao RPG Hub</button>
    </div>
  </div>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const fightId = location.pathname.split('/').pop();
  const me = qs.get('as') || '';
  const BIOMAS = ['','bioma-floresta','bioma-vulcao','bioma-gelo','bioma-deserto'];
  let state = null;
  let lastLogLen = '';
  let busy = false;
  let poll = null;

  const $ = (id) => document.getElementById(id);
  const arena = $('arena');
  arena.classList.add(BIOMAS[Math.floor(Math.random()*BIOMAS.length)] || '');

  const stars = $('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*60 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    stars.appendChild(s);
  }

  function pct(cur, max) {
    if (!max) return 0;
    return Math.max(0, Math.min(100, (cur / max) * 100));
  }

  function setPortrait(el, f) {
    el.innerHTML = '<div class="aura"></div>';
    if (f.photo) {
      const img = document.createElement('img');
      img.src = f.photo;
      img.alt = f.name;
      el.appendChild(img);
    } else {
      const d = document.createElement('div');
      d.className = 'emoji-face';
      d.textContent = f.emoji || '⚔️';
      el.appendChild(d);
    }
  }

  function barsHtml(f) {
    return (
      '<div class="bar-row"><span>HP</span><div class="bar hp"><i style="width:' + pct(f.hp, f.maxHp) + '%"></i></div></div>' +
      '<div class="bar-row"><span>MP</span><div class="bar mana"><i style="width:' + pct(f.mana, f.maxMana) + '%"></i></div></div>'
    );
  }

  function hudHtml(f) {
    return (
      '<div class="name">' + (f.emoji || '') + ' ' + f.name + '</div>' +
      '<div style="font-size:.7rem;opacity:.7">Nv.' + (f.level||0) + ' · ' + (f.className||'') + '</div>' +
      '<div class="bar hp" style="margin-top:4px"><i style="width:' + pct(f.hp,f.maxHp) + '%"></i></div>' +
      '<div class="bar mana" style="margin-top:2px"><i style="width:' + pct(f.mana,f.maxMana) + '%"></i></div>'
    );
  }

  function floatDmg(targetEl, amount, type) {
    const r = targetEl.getBoundingClientRect();
    const stage = document.body.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'dmg-float' + (type === 'crit' ? ' crit' : type === 'heal' ? ' heal' : type === 'miss' ? ' miss' : '');
    d.textContent = type === 'miss' ? 'ERROU' : type === 'heal' ? ('+' + amount) : ('-' + amount);
    d.style.left = (r.left + r.width/2 - stage.left - 20) + 'px';
    d.style.top = (r.top - stage.top + 20) + 'px';
    d.style.color = type === 'heal' ? 'var(--heal)' : type === 'miss' ? '#94a3b8' : 'var(--dmg)';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1000);
  }

  function sparks(x, y, n) {
    const fx = $('fx');
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 50;
      s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.background = ['#fff','#a78bfa','#fbbf24','#38bdf8'][i%4];
      fx.appendChild(s);
      setTimeout(() => s.remove(), 700);
    }
  }

  function slashFx(targetEl) {
    const r = targetEl.getBoundingClientRect();
    const ar = arena.getBoundingClientRect();
    const s = document.createElement('div');
    s.className = 'slash';
    s.style.left = (r.left - ar.left + r.width*0.2) + 'px';
    s.style.top = (r.top - ar.top + r.height*0.4) + 'px';
    arena.appendChild(s);
    setTimeout(() => s.remove(), 400);
    const ring = document.createElement('div');
    ring.className = 'impact-ring';
    ring.style.left = (r.left - ar.left + r.width/2) + 'px';
    ring.style.top = (r.top - ar.top + r.height/2) + 'px';
    arena.appendChild(ring);
    setTimeout(() => ring.remove(), 450);
    sparks(r.left - ar.left + r.width/2, r.top - ar.top + r.height/2, 10);
  }

  function flash() {
    const f = $('flash');
    f.classList.remove('on');
    void f.offsetWidth;
    f.classList.add('on');
  }

  function shake() {
    arena.classList.remove('shake');
    void arena.offsetWidth;
    arena.classList.add('shake');
  }

  function pushLog(text) {
    if (!text) return;
    const box = $('log');
    const d = document.createElement('div');
    d.innerHTML = text;
    box.appendChild(d);
    while (box.children.length > 3) box.removeChild(box.firstChild);
  }

  function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

  function renderFighter(side, f) {
    const root = $(side === 'a' ? 'fA' : 'fB');
    const port = $(side === 'a' ? 'portA' : 'portB');
    const bars = $(side === 'a' ? 'barsA' : 'barsB');
    $(side === 'a' ? 'nameA' : 'nameB').textContent = f.name;
    $(side === 'a' ? 'metaA' : 'metaB').textContent = (f.emoji||'') + ' ' + (f.className||'') + ' · Nv.' + (f.level||0);
    bars.innerHTML = barsHtml(f);
    if (!port.dataset.ready) {
      setPortrait(port, f);
      port.dataset.ready = '1';
    }
    root.classList.toggle('dead', f.hp <= 0);
    root.classList.toggle('defend', !!f.defending);
  }

  function renderMoves(st) {
    const btns = $('btns');
    btns.innerHTML = '';
    const myTurn = st.yourTurn;
    const moves = st.moves || [];
    $('hint').textContent = st.over
      ? 'Batalha encerrada'
      : myTurn
        ? 'Sua vez — escolha uma ação'
        : 'Aguardando oponente…';

    const labels = {
      attack: { ico: '⚔️', name: 'Ataque' },
      heavy: { ico: '💥', name: 'Pesado' },
      defend: { ico: '🛡️', name: 'Defesa' },
      special: { ico: '🌟', name: 'Especial' }
    };

    moves.forEach((m) => {
      const meta = labels[m.key] || { ico: m.emoji || '•', name: m.label };
      const b = document.createElement('button');
      b.className = 'skill' + (m.key === 'special' ? ' special' : m.key === 'defend' ? ' defend' : '');
      b.disabled = !myTurn || !!m.disabled || st.over || busy;
      b.innerHTML = '<span class="ico">' + (m.emoji || meta.ico) + '</span><span>' + (m.label || meta.name) + '</span>';
      b.onclick = () => doMove(m.key);
      btns.appendChild(b);
    });

    if (!moves.length) {
      ['attack','heavy','defend','special'].forEach((k) => {
        const meta = labels[k];
        const b = document.createElement('button');
        b.className = 'skill' + (k === 'special' ? ' special' : k === 'defend' ? ' defend' : '');
        b.disabled = !myTurn || st.over || busy;
        b.innerHTML = '<span class="ico">' + meta.ico + '</span><span>' + meta.name + '</span>';
        b.onclick = () => doMove(k);
        btns.appendChild(b);
      });
    }
  }

  async function playAnim(kind, attackerSide, defenderSide) {
    const atk = $(attackerSide === 'a' ? 'fA' : 'fB');
    const def = $(defenderSide === 'a' ? 'fA' : 'fB');
    atk.classList.add('lunge');
    await wait(280);
    if (kind === 'defend') {
      atk.classList.add('defend');
      await wait(200);
      atk.classList.remove('lunge');
      return;
    }
    slashFx(def);
    flash();
    shake();
    def.classList.add('hit');
    await wait(350);
    atk.classList.remove('lunge');
    def.classList.remove('hit');
  }

  function detectDamage(prev, next) {
    if (!prev || !next) return;
    ['a','b'].forEach((side) => {
      const pf = prev[side];
      const nf = next[side];
      if (!pf || !nf) return;
      const el = $(side === 'a' ? 'fA' : 'fB');
      if (nf.hp < pf.hp) {
        const dmg = Math.round(pf.hp - nf.hp);
        floatDmg(el, dmg, dmg > (pf.maxHp * 0.18) ? 'crit' : 'hit');
      } else if (nf.hp > pf.hp) {
        floatDmg(el, Math.round(nf.hp - pf.hp), 'heal');
      }
    });
  }

  function render(st, animate) {
    if (!st || !st.a || !st.b) return;
    const prev = state;
    $('hudA').innerHTML = hudHtml(st.a);
    $('hudB').innerHTML = hudHtml(st.b);
    renderFighter('a', st.a);
    renderFighter('b', st.b);

    const turnId = st.turn;
    const aTurn = String(st.a.id) === String(turnId);
    $('fA').classList.toggle('turn', aTurn && !st.over);
    $('fB').classList.toggle('turn', !aTurn && !st.over);
    $('turnBadge').textContent = st.over
      ? 'FIM'
      : aTurn
        ? '▶ VEZ DE ' + st.a.name.toUpperCase()
        : '▶ VEZ DE ' + st.b.name.toUpperCase();

    if (st.lastLog && st.lastLog !== lastLogLen) {
      pushLog(st.lastLog);
      lastLogLen = st.lastLog;
    }

    if (animate && prev) detectDamage(prev, st);

    renderMoves(st);

    if (st.over) {
      $('end').classList.add('show');
      const winner = st.winnerId;
      const wName = String(winner) === String(st.a.id) ? st.a.name : String(winner) === String(st.b.id) ? st.b.name : 'Empate';
      $('endTitle').textContent = winner ? ('🏆 ' + wName + ' venceu!') : 'Empate';
      $('endDesc').textContent = st.lastLog || 'A batalha chegou ao fim.';
      if (poll) clearInterval(poll);
    }

    state = st;
  }

  async function fetchState() {
    const r = await fetch('/api/pvp/' + fightId + (me ? '?as=' + encodeURIComponent(me) : ''));
    if (!r.ok) throw new Error('Arena não encontrada');
    return r.json();
  }

  async function doMove(kind) {
    if (busy || !state || !state.yourTurn || state.over) return;
    busy = true;
    renderMoves({ ...state, yourTurn: false });
    const mySide = String(state.a.id) === String(me) ? 'a' : 'b';
    const otherSide = mySide === 'a' ? 'b' : 'a';
    try {
      await playAnim(kind, mySide, otherSide);
      const r = await fetch('/api/pvp/' + fightId + '/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: me, move: kind })
      });
      const data = await r.json();
      if (!data.ok && data.error) pushLog('❌ ' + data.error);
      const st = await fetchState();
      render(st, true);
    } catch (e) {
      pushLog('❌ ' + (e.message || 'Falha'));
    }
    busy = false;
  }

  async function boot() {
    try {
      const st = await fetchState();
      $('loading').classList.add('hide');
      lastLogLen = '';
      render(st, false);
      poll = setInterval(async () => {
        if (busy) return;
        try {
          const s = await fetchState();
          render(s, true);
        } catch (_) {}
      }, 1800);
    } catch (e) {
      $('loading').textContent = 'Arena não encontrada ou expirou.';
    }
  }
  boot();
})();
</script>
</body>
</html>
