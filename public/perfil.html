<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aeternus — Perfil</title><link rel="stylesheet" href="dashboard.css"></head><body class="landing-body"><header class="header"><nav class="navbar"><div class="logo"><a href="/"><span class="logo-accent">AET</span>ERNUS</a></div><a class="nav-link" href="/">← Início</a></nav></header><main class="simple-page"><section class="page-hero"><span class="admin-badge">AETERNUS • PERFIL</span><h1>Seu perfil</h1><p>Veja as informações da sua conta conectada ao painel.</p></section><section class="profile-card" id="profile"><div class="profile-avatar">✦</div><div><h2 id="profile-name">Carregando...</h2><p id="profile-id">Consultando sua conta Discord.</p></div></section></main><script>fetch('/api/me').then(r=>r.json()).then(d=>{const u=d.user||d;if(u&&u.id){document.getElementById('profile-name').textContent=u.global_name||u.username||'Usuário';document.getElementById('profile-id').textContent='ID: '+u.id}else document.getElementById('profile-name').textContent='Não conectado';}).catch(()=>document.getElementById('profile-name').textContent='Não foi possível carregar o perfil');</script>    <script src="dashboard-app.js"></script>
</body></html>
