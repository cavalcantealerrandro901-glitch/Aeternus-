# Blueprint Render — https://render.com
# Serviço Web (bot + painel) + variáveis de ambiente
services:
  - type: web
    name: aeternus-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: REQUIRE_MONGO
        value: "1"
      - key: ALLOW_LOCAL_DATA
        value: "0"
